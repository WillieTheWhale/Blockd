groups:
  - name: blockd_alerts
    interval: 30s
    rules:
      # High Error Rate Alert
      - alert: HighErrorRate
        expr: |
          (sum(rate(http_requests_total{status=~"5.."}[5m])) by (service) /
          sum(rate(http_requests_total[5m])) by (service)) > 0.01
        for: 5m
        labels:
          severity: critical
          component: api
        annotations:
          summary: "High error rate detected in {{ $labels.service }}"
          description: "Service {{ $labels.service }} has error rate of {{ $value | humanizePercentage }} (threshold: 1%)"
          runbook_url: "https://docs.blockd.io/runbooks/high-error-rate"

      # High Latency Alert
      - alert: HighLatency
        expr: |
          histogram_quantile(0.95,
            sum(rate(http_request_duration_seconds_bucket[5m])) by (service, le)
          ) > 0.5
        for: 5m
        labels:
          severity: warning
          component: api
        annotations:
          summary: "High latency detected in {{ $labels.service }}"
          description: "Service {{ $labels.service }} p95 latency is {{ $value }}s (threshold: 500ms)"
          runbook_url: "https://docs.blockd.io/runbooks/high-latency"

      # Service Down Alert
      - alert: ServiceDown
        expr: up{job=~".*blockd.*"} == 0
        for: 2m
        labels:
          severity: critical
          component: infrastructure
        annotations:
          summary: "Service {{ $labels.job }} is down"
          description: "Service {{ $labels.job }} on {{ $labels.instance }} has been down for more than 2 minutes"
          runbook_url: "https://docs.blockd.io/runbooks/service-down"

      # Database Connection Pool Exhausted
      - alert: DatabaseConnectionPoolExhausted
        expr: |
          (pg_stat_activity_count / pg_settings_max_connections) > 0.9
        for: 5m
        labels:
          severity: critical
          component: database
        annotations:
          summary: "Database connection pool near exhaustion"
          description: "Database connection pool is at {{ $value | humanizePercentage }} capacity (threshold: 90%)"
          runbook_url: "https://docs.blockd.io/runbooks/database-connections"

      # High Database Query Time
      - alert: HighDatabaseQueryTime
        expr: |
          rate(pg_stat_statements_mean_time_seconds[5m]) > 1
        for: 10m
        labels:
          severity: warning
          component: database
        annotations:
          summary: "High database query time detected"
          description: "Average query time is {{ $value }}s (threshold: 1s)"
          runbook_url: "https://docs.blockd.io/runbooks/slow-queries"

      # Redis Memory High
      - alert: RedisMemoryHigh
        expr: |
          (redis_memory_used_bytes / redis_memory_max_bytes) > 0.8
        for: 5m
        labels:
          severity: warning
          component: redis
        annotations:
          summary: "Redis memory usage is high"
          description: "Redis memory usage is at {{ $value | humanizePercentage }} (threshold: 80%)"
          runbook_url: "https://docs.blockd.io/runbooks/redis-memory"

      # Redis Cache Hit Rate Low
      - alert: RedisCacheHitRateLow
        expr: |
          rate(redis_keyspace_hits_total[5m]) /
          (rate(redis_keyspace_hits_total[5m]) + rate(redis_keyspace_misses_total[5m])) < 0.8
        for: 10m
        labels:
          severity: warning
          component: redis
        annotations:
          summary: "Redis cache hit rate is low"
          description: "Redis cache hit rate is {{ $value | humanizePercentage }} (threshold: 80%)"
          runbook_url: "https://docs.blockd.io/runbooks/cache-performance"

      # Pod CPU Usage High
      - alert: PodCPUUsageHigh
        expr: |
          sum(rate(container_cpu_usage_seconds_total{namespace="production"}[5m])) by (pod) /
          sum(container_spec_cpu_quota{namespace="production"} / container_spec_cpu_period{namespace="production"}) by (pod) > 0.9
        for: 10m
        labels:
          severity: warning
          component: kubernetes
        annotations:
          summary: "Pod {{ $labels.pod }} CPU usage is high"
          description: "Pod {{ $labels.pod }} CPU usage is at {{ $value | humanizePercentage }} (threshold: 90%)"
          runbook_url: "https://docs.blockd.io/runbooks/pod-resources"

      # Pod Memory Usage High
      - alert: PodMemoryUsageHigh
        expr: |
          sum(container_memory_working_set_bytes{namespace="production"}) by (pod) /
          sum(container_spec_memory_limit_bytes{namespace="production"}) by (pod) > 0.9
        for: 10m
        labels:
          severity: warning
          component: kubernetes
        annotations:
          summary: "Pod {{ $labels.pod }} memory usage is high"
          description: "Pod {{ $labels.pod }} memory usage is at {{ $value | humanizePercentage }} (threshold: 90%)"
          runbook_url: "https://docs.blockd.io/runbooks/pod-resources"

      # Pod Restart Frequency High
      - alert: PodRestartingFrequently
        expr: |
          rate(kube_pod_container_status_restarts_total{namespace="production"}[15m]) > 0
        for: 5m
        labels:
          severity: warning
          component: kubernetes
        annotations:
          summary: "Pod {{ $labels.pod }} is restarting frequently"
          description: "Pod {{ $labels.pod }} has restarted {{ $value }} times in the last 15 minutes"
          runbook_url: "https://docs.blockd.io/runbooks/pod-restarts"

      # Disk Space Low
      - alert: DiskSpaceLow
        expr: |
          (node_filesystem_avail_bytes{fstype!="tmpfs"} /
          node_filesystem_size_bytes{fstype!="tmpfs"}) < 0.2
        for: 5m
        labels:
          severity: warning
          component: infrastructure
        annotations:
          summary: "Disk space is low on {{ $labels.instance }}"
          description: "Disk space on {{ $labels.instance }} is at {{ $value | humanizePercentage }} available (threshold: 20%)"
          runbook_url: "https://docs.blockd.io/runbooks/disk-space"

      # AI Detection Service Slow
      - alert: AIDetectionServiceSlow
        expr: |
          histogram_quantile(0.95,
            sum(rate(ai_detection_analysis_duration_seconds_bucket[5m])) by (le)
          ) > 5
        for: 10m
        labels:
          severity: warning
          component: ai-detection
        annotations:
          summary: "AI Detection service is slow"
          description: "AI Detection p95 analysis time is {{ $value }}s (threshold: 5s)"
          runbook_url: "https://docs.blockd.io/runbooks/ai-detection-slow"

      # WebSocket Connection Issues
      - alert: WebSocketConnectionIssues
        expr: |
          rate(websocket_connection_errors_total[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
          component: websocket
        annotations:
          summary: "High WebSocket connection error rate"
          description: "WebSocket connection error rate is {{ $value }} errors/sec"
          runbook_url: "https://docs.blockd.io/runbooks/websocket-errors"

      # Video Service Upload Failures
      - alert: VideoUploadFailures
        expr: |
          rate(video_upload_failures_total[5m]) > 0.05
        for: 5m
        labels:
          severity: critical
          component: video-service
        annotations:
          summary: "High video upload failure rate"
          description: "Video upload failure rate is {{ $value }} failures/sec (threshold: 0.05/sec)"
          runbook_url: "https://docs.blockd.io/runbooks/video-upload-failures"

      # RabbitMQ Queue Size High
      - alert: RabbitMQQueueSizeHigh
        expr: |
          rabbitmq_queue_messages > 1000
        for: 10m
        labels:
          severity: warning
          component: rabbitmq
        annotations:
          summary: "RabbitMQ queue {{ $labels.queue }} size is high"
          description: "Queue {{ $labels.queue }} has {{ $value }} messages (threshold: 1000)"
          runbook_url: "https://docs.blockd.io/runbooks/rabbitmq-queue-size"

      # SSL Certificate Expiring
      - alert: SSLCertificateExpiring
        expr: |
          (ssl_certificate_expiry_seconds - time()) / 86400 < 30
        for: 1h
        labels:
          severity: warning
          component: infrastructure
        annotations:
          summary: "SSL certificate expiring soon"
          description: "SSL certificate for {{ $labels.domain }} expires in {{ $value }} days"
          runbook_url: "https://docs.blockd.io/runbooks/ssl-renewal"

      # ==========================================
      # PostgreSQL HA Alerts
      # ==========================================

      # PostgreSQL Replication Lag
      - alert: PostgreSQLReplicationLag
        expr: |
          pg_replication_lag_seconds > 30
        for: 5m
        labels:
          severity: warning
          component: database
        annotations:
          summary: "PostgreSQL replication lag detected on {{ $labels.instance }}"
          description: "Replica {{ $labels.instance }} is {{ $value }}s behind primary (threshold: 30s)"
          runbook_url: "https://docs.blockd.io/runbooks/postgresql-replication-lag"

      # PostgreSQL Replication Lag Critical
      - alert: PostgreSQLReplicationLagCritical
        expr: |
          pg_replication_lag_seconds > 300
        for: 2m
        labels:
          severity: critical
          component: database
        annotations:
          summary: "Critical PostgreSQL replication lag on {{ $labels.instance }}"
          description: "Replica {{ $labels.instance }} is {{ $value }}s behind primary - data loss risk!"
          runbook_url: "https://docs.blockd.io/runbooks/postgresql-replication-lag"

      # PostgreSQL Replica Down
      - alert: PostgreSQLReplicaDown
        expr: |
          pg_replication_is_replica == 0 and pg_up{job="postgresql-ha"} == 1
        for: 5m
        labels:
          severity: critical
          component: database
        annotations:
          summary: "PostgreSQL replica is not streaming"
          description: "PostgreSQL instance {{ $labels.instance }} is not replicating from primary"
          runbook_url: "https://docs.blockd.io/runbooks/postgresql-replica-down"

      # PostgreSQL No Primary
      - alert: PostgreSQLNoPrimary
        expr: |
          count(patroni_master{job="postgresql-ha"} == 1) == 0
        for: 1m
        labels:
          severity: critical
          component: database
        annotations:
          summary: "No PostgreSQL primary available"
          description: "Patroni cluster has no leader - database is unavailable for writes!"
          runbook_url: "https://docs.blockd.io/runbooks/postgresql-no-primary"

      # PostgreSQL Too Many Primaries (Split Brain)
      - alert: PostgreSQLSplitBrain
        expr: |
          count(patroni_master{job="postgresql-ha"} == 1) > 1
        for: 1m
        labels:
          severity: critical
          component: database
        annotations:
          summary: "PostgreSQL split brain detected!"
          description: "Multiple PostgreSQL instances claim to be primary - immediate action required!"
          runbook_url: "https://docs.blockd.io/runbooks/postgresql-split-brain"

      # etcd Cluster Unhealthy
      - alert: EtcdClusterUnhealthy
        expr: |
          etcd_server_has_leader{job="etcd"} == 0
        for: 2m
        labels:
          severity: critical
          component: database
        annotations:
          summary: "etcd cluster has no leader"
          description: "etcd cluster is unhealthy - Patroni failover will not work!"
          runbook_url: "https://docs.blockd.io/runbooks/etcd-unhealthy"

      # ==========================================
      # PgBouncer Alerts
      # ==========================================

      # PgBouncer Pool Utilization High
      - alert: PgBouncerPoolUtilizationHigh
        expr: |
          (pgbouncer_pools_server_active / pgbouncer_pools_server_maxconn) > 0.8
        for: 5m
        labels:
          severity: warning
          component: database
        annotations:
          summary: "PgBouncer pool utilization high for {{ $labels.database }}"
          description: "PgBouncer pool {{ $labels.database }} is at {{ $value | humanizePercentage }} capacity"
          runbook_url: "https://docs.blockd.io/runbooks/pgbouncer-pool-utilization"

      # PgBouncer Pool Exhausted
      - alert: PgBouncerPoolExhausted
        expr: |
          (pgbouncer_pools_server_active / pgbouncer_pools_server_maxconn) > 0.95
        for: 2m
        labels:
          severity: critical
          component: database
        annotations:
          summary: "PgBouncer pool nearly exhausted for {{ $labels.database }}"
          description: "PgBouncer pool {{ $labels.database }} is at {{ $value | humanizePercentage }} - connections will be rejected!"
          runbook_url: "https://docs.blockd.io/runbooks/pgbouncer-pool-exhausted"

      # PgBouncer Client Wait Time
      - alert: PgBouncerClientWaitTimeHigh
        expr: |
          pgbouncer_pools_client_wait_time > 5
        for: 5m
        labels:
          severity: warning
          component: database
        annotations:
          summary: "High client wait time in PgBouncer"
          description: "Clients are waiting {{ $value }}s for database connections (threshold: 5s)"
          runbook_url: "https://docs.blockd.io/runbooks/pgbouncer-wait-time"

      # PgBouncer Down
      - alert: PgBouncerDown
        expr: |
          up{job="pgbouncer"} == 0
        for: 1m
        labels:
          severity: critical
          component: database
        annotations:
          summary: "PgBouncer instance is down"
          description: "PgBouncer instance {{ $labels.instance }} is not responding"
          runbook_url: "https://docs.blockd.io/runbooks/pgbouncer-down"

      # ==========================================
      # Backup Alerts
      # ==========================================

      # PostgreSQL Backup Failed
      - alert: PostgreSQLBackupFailed
        expr: |
          kube_job_failed{job_name=~"postgresql-base-backup.*"} > 0
        for: 5m
        labels:
          severity: critical
          component: database
        annotations:
          summary: "PostgreSQL backup job failed"
          description: "Backup job {{ $labels.job_name }} has failed - check logs for details"
          runbook_url: "https://docs.blockd.io/runbooks/postgresql-backup-failed"

      # PostgreSQL Backup Missing
      - alert: PostgreSQLBackupMissing
        expr: |
          time() - postgresql_backup_last_success_timestamp > 90000
        for: 10m
        labels:
          severity: critical
          component: database
        annotations:
          summary: "PostgreSQL backup is overdue"
          description: "Last successful backup was {{ $value | humanizeDuration }} ago (expected: daily)"
          runbook_url: "https://docs.blockd.io/runbooks/postgresql-backup-missing"

      # WAL Archiving Failed
      - alert: PostgreSQLWALArchivingFailed
        expr: |
          pg_stat_archiver_failed_count > 0
        for: 10m
        labels:
          severity: warning
          component: database
        annotations:
          summary: "PostgreSQL WAL archiving has failures"
          description: "{{ $value }} WAL files failed to archive - PITR recovery may be incomplete"
          runbook_url: "https://docs.blockd.io/runbooks/postgresql-wal-archive-failed"

groups:
  - name: blockd_alerts
    interval: 30s
    rules:
      # High Error Rate Alert
      - alert: HighErrorRate
        expr: |
          (sum(rate(http_requests_total{status=~"5.."}[5m])) by (service) /
          sum(rate(http_requests_total[5m])) by (service)) > 0.01
        for: 5m
        labels:
          severity: critical
          component: api
        annotations:
          summary: "High error rate detected in {{ $labels.service }}"
          description: "Service {{ $labels.service }} has error rate of {{ $value | humanizePercentage }} (threshold: 1%)"
          runbook_url: "https://docs.blockd.io/runbooks/high-error-rate"

      # High Latency Alert
      - alert: HighLatency
        expr: |
          histogram_quantile(0.95,
            sum(rate(http_request_duration_seconds_bucket[5m])) by (service, le)
          ) > 0.5
        for: 5m
        labels:
          severity: warning
          component: api
        annotations:
          summary: "High latency detected in {{ $labels.service }}"
          description: "Service {{ $labels.service }} p95 latency is {{ $value }}s (threshold: 500ms)"
          runbook_url: "https://docs.blockd.io/runbooks/high-latency"

      # Service Down Alert
      - alert: ServiceDown
        expr: up{job=~".*blockd.*"} == 0
        for: 2m
        labels:
          severity: critical
          component: infrastructure
        annotations:
          summary: "Service {{ $labels.job }} is down"
          description: "Service {{ $labels.job }} on {{ $labels.instance }} has been down for more than 2 minutes"
          runbook_url: "https://docs.blockd.io/runbooks/service-down"

      # Database Connection Pool Exhausted
      - alert: DatabaseConnectionPoolExhausted
        expr: |
          (pg_stat_activity_count / pg_settings_max_connections) > 0.9
        for: 5m
        labels:
          severity: critical
          component: database
        annotations:
          summary: "Database connection pool near exhaustion"
          description: "Database connection pool is at {{ $value | humanizePercentage }} capacity (threshold: 90%)"
          runbook_url: "https://docs.blockd.io/runbooks/database-connections"

      # High Database Query Time
      - alert: HighDatabaseQueryTime
        expr: |
          rate(pg_stat_statements_mean_time_seconds[5m]) > 1
        for: 10m
        labels:
          severity: warning
          component: database
        annotations:
          summary: "High database query time detected"
          description: "Average query time is {{ $value }}s (threshold: 1s)"
          runbook_url: "https://docs.blockd.io/runbooks/slow-queries"

      # Redis Memory High
      - alert: RedisMemoryHigh
        expr: |
          (redis_memory_used_bytes / redis_memory_max_bytes) > 0.8
        for: 5m
        labels:
          severity: warning
          component: redis
        annotations:
          summary: "Redis memory usage is high"
          description: "Redis memory usage is at {{ $value | humanizePercentage }} (threshold: 80%)"
          runbook_url: "https://docs.blockd.io/runbooks/redis-memory"

      # Redis Cache Hit Rate Low
      - alert: RedisCacheHitRateLow
        expr: |
          rate(redis_keyspace_hits_total[5m]) /
          (rate(redis_keyspace_hits_total[5m]) + rate(redis_keyspace_misses_total[5m])) < 0.8
        for: 10m
        labels:
          severity: warning
          component: redis
        annotations:
          summary: "Redis cache hit rate is low"
          description: "Redis cache hit rate is {{ $value | humanizePercentage }} (threshold: 80%)"
          runbook_url: "https://docs.blockd.io/runbooks/cache-performance"

      # Pod CPU Usage High
      - alert: PodCPUUsageHigh
        expr: |
          sum(rate(container_cpu_usage_seconds_total{namespace="production"}[5m])) by (pod) /
          sum(container_spec_cpu_quota{namespace="production"} / container_spec_cpu_period{namespace="production"}) by (pod) > 0.9
        for: 10m
        labels:
          severity: warning
          component: kubernetes
        annotations:
          summary: "Pod {{ $labels.pod }} CPU usage is high"
          description: "Pod {{ $labels.pod }} CPU usage is at {{ $value | humanizePercentage }} (threshold: 90%)"
          runbook_url: "https://docs.blockd.io/runbooks/pod-resources"

      # Pod Memory Usage High
      - alert: PodMemoryUsageHigh
        expr: |
          sum(container_memory_working_set_bytes{namespace="production"}) by (pod) /
          sum(container_spec_memory_limit_bytes{namespace="production"}) by (pod) > 0.9
        for: 10m
        labels:
          severity: warning
          component: kubernetes
        annotations:
          summary: "Pod {{ $labels.pod }} memory usage is high"
          description: "Pod {{ $labels.pod }} memory usage is at {{ $value | humanizePercentage }} (threshold: 90%)"
          runbook_url: "https://docs.blockd.io/runbooks/pod-resources"

      # Pod Restart Frequency High
      - alert: PodRestartingFrequently
        expr: |
          rate(kube_pod_container_status_restarts_total{namespace="production"}[15m]) > 0
        for: 5m
        labels:
          severity: warning
          component: kubernetes
        annotations:
          summary: "Pod {{ $labels.pod }} is restarting frequently"
          description: "Pod {{ $labels.pod }} has restarted {{ $value }} times in the last 15 minutes"
          runbook_url: "https://docs.blockd.io/runbooks/pod-restarts"

      # Disk Space Low
      - alert: DiskSpaceLow
        expr: |
          (node_filesystem_avail_bytes{fstype!="tmpfs"} /
          node_filesystem_size_bytes{fstype!="tmpfs"}) < 0.2
        for: 5m
        labels:
          severity: warning
          component: infrastructure
        annotations:
          summary: "Disk space is low on {{ $labels.instance }}"
          description: "Disk space on {{ $labels.instance }} is at {{ $value | humanizePercentage }} available (threshold: 20%)"
          runbook_url: "https://docs.blockd.io/runbooks/disk-space"

      # AI Detection Service Slow
      - alert: AIDetectionServiceSlow
        expr: |
          histogram_quantile(0.95,
            sum(rate(ai_detection_analysis_duration_seconds_bucket[5m])) by (le)
          ) > 5
        for: 10m
        labels:
          severity: warning
          component: ai-detection
        annotations:
          summary: "AI Detection service is slow"
          description: "AI Detection p95 analysis time is {{ $value }}s (threshold: 5s)"
          runbook_url: "https://docs.blockd.io/runbooks/ai-detection-slow"

      # WebSocket Connection Issues
      - alert: WebSocketConnectionIssues
        expr: |
          rate(websocket_connection_errors_total[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
          component: websocket
        annotations:
          summary: "High WebSocket connection error rate"
          description: "WebSocket connection error rate is {{ $value }} errors/sec"
          runbook_url: "https://docs.blockd.io/runbooks/websocket-errors"

      # Video Service Upload Failures
      - alert: VideoUploadFailures
        expr: |
          rate(video_upload_failures_total[5m]) > 0.05
        for: 5m
        labels:
          severity: critical
          component: video-service
        annotations:
          summary: "High video upload failure rate"
          description: "Video upload failure rate is {{ $value }} failures/sec (threshold: 0.05/sec)"
          runbook_url: "https://docs.blockd.io/runbooks/video-upload-failures"

      # RabbitMQ Queue Size High
      - alert: RabbitMQQueueSizeHigh
        expr: |
          rabbitmq_queue_messages > 1000
        for: 10m
        labels:
          severity: warning
          component: rabbitmq
        annotations:
          summary: "RabbitMQ queue {{ $labels.queue }} size is high"
          description: "Queue {{ $labels.queue }} has {{ $value }} messages (threshold: 1000)"
          runbook_url: "https://docs.blockd.io/runbooks/rabbitmq-queue-size"

      # SSL Certificate Expiring
      - alert: SSLCertificateExpiring
        expr: |
          (ssl_certificate_expiry_seconds - time()) / 86400 < 30
        for: 1h
        labels:
          severity: warning
          component: infrastructure
        annotations:
          summary: "SSL certificate expiring soon"
          description: "SSL certificate for {{ $labels.domain }} expires in {{ $value }} days"
          runbook_url: "https://docs.blockd.io/runbooks/ssl-renewal"

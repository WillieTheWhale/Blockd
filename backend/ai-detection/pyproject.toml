[tool.poetry]
name = "blockd-ai-detection"
version = "1.0.0"
description = "AI answer detection service for Blockd interview platform"
authors = ["Blockd Team"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.14.0"
fastapi = "0.121.3"
uvicorn = {extras = ["standard"], version = "0.32.1"}
pydantic = "2.10.4"
pydantic-settings = "2.7.0"
python-multipart = "0.0.20"
psycopg2-binary = "2.9.10"
sqlalchemy = "2.0.36"
pgvector = "0.3.6"
redis = "5.2.1"
pika = "1.3.2"
openai = "1.59.5"
anthropic = "0.42.0"
google-generativeai = "0.8.3"
sentence-transformers = "3.3.1"
transformers = "4.47.1"
torch = "2.5.1"
xgboost = "2.1.3"
scikit-learn = "1.6.1"
numpy = "2.2.1"
pandas = "2.2.3"
nltk = "3.9.1"
spacy = "3.8.3"
python-dotenv = "1.0.1"
httpx = "0.28.1"
aiofiles = "24.1.0"
tenacity = "9.0.0"
python-json-logger = "3.2.1"
prometheus-client = "0.21.1"

[tool.poetry.group.dev.dependencies]
pytest = "8.3.4"
pytest-asyncio = "0.24.0"
pytest-cov = "6.0.0"
pytest-mock = "3.14.0"
httpx-mock = "0.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=. --cov-report=html --cov-report=term"

[tool.black]
line-length = 100
target-version = ['py314']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100

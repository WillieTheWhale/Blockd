version: '3.8'

services:
  video-service:
    build: .
    container_name: blockd-video-service
    ports:
      - "8003:8003"
      - "3000:3000"
      - "10000-10100:10000-10100/udp"
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - DATABASE_URL=postgresql://blockd:blockd@postgres:5432/blockd
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_BUCKET=blockd-recordings
      - S3_USE_SSL=false
      - ANNOUNCED_IP=${ANNOUNCED_IP:-127.0.0.1}
    volumes:
      - ./recordings:/tmp/recordings
    depends_on:
      - postgres
      - redis
      - rabbitmq
      - minio
    networks:
      - blockd-network
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: blockd-postgres
    environment:
      - POSTGRES_DB=blockd
      - POSTGRES_USER=blockd
      - POSTGRES_PASSWORD=blockd
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - blockd-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: blockd-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - blockd-network
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: blockd-rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - blockd-network
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: blockd-minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - blockd-network
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  minio-data:

networks:
  blockd-network:
    driver: bridge

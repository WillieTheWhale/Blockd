# Infrastructure Drift Detection Workflow
# Detects configuration drift between Terraform state and actual infrastructure
#
# Runs:
# 1. Scheduled daily to detect drift
# 2. Manual trigger for on-demand checks
# 3. After production deployments (via workflow_call)
name: Drift Detection

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to check'
        required: true
        type: choice
        options:
          - dev
          - staging
          - production
          - all
      notify_on_drift:
        description: 'Send notification if drift detected'
        required: false
        type: boolean
        default: true

  # Daily drift detection
  schedule:
    - cron: '0 6 * * *'  # 6 AM UTC daily

  # Can be called from other workflows
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      SLACK_WEBHOOK_URL:
        required: true

env:
  TF_VERSION: '1.6.0'
  AWS_REGION: 'us-east-1'

jobs:
  detect-drift:
    name: Detect Drift - ${{ matrix.environment }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ github.event_name == 'schedule' && fromJSON('["dev", "staging", "production"]') || (inputs.environment == 'all' && fromJSON('["dev", "staging", "production"]') || fromJSON(format('["{0}"]', inputs.environment))) }}

    outputs:
      drift_detected: ${{ steps.plan.outputs.drift_detected }}
      drift_summary: ${{ steps.plan.outputs.drift_summary }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: infrastructure/terraform/environments/${{ matrix.environment }}
        run: |
          terraform init -backend=true -input=false

      - name: Terraform Plan (Drift Detection)
        id: plan
        working-directory: infrastructure/terraform/environments/${{ matrix.environment }}
        continue-on-error: true
        run: |
          # Run plan with detailed exit codes
          # Exit code 0 = no changes (no drift)
          # Exit code 1 = error
          # Exit code 2 = changes detected (drift)
          set +e
          terraform plan -detailed-exitcode -input=false -out=tfplan 2>&1 | tee plan_output.txt
          EXIT_CODE=$?
          set -e

          if [ $EXIT_CODE -eq 0 ]; then
            echo "No drift detected"
            echo "drift_detected=false" >> $GITHUB_OUTPUT
            echo "drift_summary=No drift detected for ${{ matrix.environment }}" >> $GITHUB_OUTPUT
          elif [ $EXIT_CODE -eq 2 ]; then
            echo "::warning::Drift detected in ${{ matrix.environment }} environment!"
            echo "drift_detected=true" >> $GITHUB_OUTPUT

            # Extract summary of changes
            SUMMARY=$(grep -E "^Plan:|^  #|will be|must be" plan_output.txt | head -20 || echo "Changes detected")
            echo "drift_summary<<EOF" >> $GITHUB_OUTPUT
            echo "$SUMMARY" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "::error::Terraform plan failed!"
            echo "drift_detected=error" >> $GITHUB_OUTPUT
            echo "drift_summary=Terraform plan failed for ${{ matrix.environment }}" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Generate drift report
        if: steps.plan.outputs.drift_detected == 'true'
        working-directory: infrastructure/terraform/environments/${{ matrix.environment }}
        run: |
          # Generate detailed drift report
          echo "# Drift Report for ${{ matrix.environment }}" > drift_report.md
          echo "" >> drift_report.md
          echo "**Generated:** $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> drift_report.md
          echo "**Environment:** ${{ matrix.environment }}" >> drift_report.md
          echo "**Run ID:** ${{ github.run_id }}" >> drift_report.md
          echo "" >> drift_report.md
          echo "## Changes Detected" >> drift_report.md
          echo '```' >> drift_report.md
          cat plan_output.txt >> drift_report.md
          echo '```' >> drift_report.md

          # Show the plan in logs
          echo "===== DRIFT REPORT ====="
          cat drift_report.md
          echo "========================"

      - name: Upload drift report
        if: steps.plan.outputs.drift_detected == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: drift-report-${{ matrix.environment }}
          path: infrastructure/terraform/environments/${{ matrix.environment }}/drift_report.md
          retention-days: 30

      - name: Check for critical drift
        id: critical
        if: steps.plan.outputs.drift_detected == 'true'
        working-directory: infrastructure/terraform/environments/${{ matrix.environment }}
        run: |
          # Check for critical resources that have drifted
          CRITICAL_RESOURCES="aws_eks_cluster|aws_rds_cluster|aws_elasticache|aws_iam_role|aws_security_group"

          if grep -E "$CRITICAL_RESOURCES" plan_output.txt | grep -q "must be replaced\|will be destroyed"; then
            echo "::error::Critical infrastructure drift detected!"
            echo "critical=true" >> $GITHUB_OUTPUT
          else
            echo "critical=false" >> $GITHUB_OUTPUT
          fi

  kubernetes-drift:
    name: Kubernetes Drift - ${{ matrix.environment }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ github.event_name == 'schedule' && fromJSON('["staging", "production"]') || (inputs.environment == 'all' && fromJSON('["staging", "production"]') || fromJSON(format('["{0}"]', inputs.environment))) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.28.0'

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.13.0'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig --name blockd-${{ matrix.environment }}-cluster --region ${{ env.AWS_REGION }}

      - name: Helm diff
        id: helm_diff
        continue-on-error: true
        run: |
          # Install helm-diff plugin
          helm plugin install https://github.com/databus23/helm-diff || true

          # Run helm diff
          helm diff upgrade blockd ./k8s/helm/blockd \
            --namespace ${{ matrix.environment }} \
            --values k8s/helm/blockd/values-${{ matrix.environment }}.yaml \
            --allow-unreleased 2>&1 | tee helm_diff_output.txt

          # Check if there are differences
          if [ -s helm_diff_output.txt ] && grep -q "^[-+]" helm_diff_output.txt; then
            echo "k8s_drift_detected=true" >> $GITHUB_OUTPUT
            echo "::warning::Kubernetes drift detected in ${{ matrix.environment }}!"
          else
            echo "k8s_drift_detected=false" >> $GITHUB_OUTPUT
          fi

      - name: Check for manually modified resources
        id: manual_changes
        run: |
          # Check for resources with last-applied-configuration that don't match
          NAMESPACES="${{ matrix.environment }}"

          echo "Checking for manually modified resources..."

          # Get all deployments and check for modifications
          kubectl get deployments -n $NAMESPACES -o json | jq -r '
            .items[] |
            select(.metadata.annotations["kubectl.kubernetes.io/last-applied-configuration"] != null) |
            .metadata.name
          ' > managed_resources.txt

          # Check ConfigMaps that might have been manually modified
          MANUAL_CMS=$(kubectl get configmap -n $NAMESPACES -o json | jq -r '
            .items[] |
            select(.metadata.annotations["kubectl.kubernetes.io/last-applied-configuration"] == null) |
            select(.metadata.name | test("^(blockd|api-|auth-|session-)")) |
            .metadata.name
          ' | wc -l)

          if [ "$MANUAL_CMS" -gt 0 ]; then
            echo "::warning::Found $MANUAL_CMS potentially manually created ConfigMaps"
            echo "manual_changes_detected=true" >> $GITHUB_OUTPUT
          else
            echo "manual_changes_detected=false" >> $GITHUB_OUTPUT
          fi

  summarize:
    name: Summarize Results
    runs-on: ubuntu-latest
    needs: [detect-drift, kubernetes-drift]
    if: always()

    steps:
      - name: Create summary
        id: summary
        run: |
          echo "# Infrastructure Drift Detection Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Date:** $(date -u +%Y-%m-%d)" >> $GITHUB_STEP_SUMMARY
          echo "**Run ID:** ${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Check if any drift was detected
          DRIFT_DETECTED="false"

          echo "## Terraform Drift" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # This would be populated from the matrix outputs in a real scenario
          if [ "${{ needs.detect-drift.result }}" != "success" ]; then
            echo "- Some drift checks failed or detected changes" >> $GITHUB_STEP_SUMMARY
            DRIFT_DETECTED="true"
          else
            echo "- All Terraform checks passed" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Kubernetes Drift" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.kubernetes-drift.result }}" != "success" ]; then
            echo "- Some Kubernetes drift detected" >> $GITHUB_STEP_SUMMARY
            DRIFT_DETECTED="true"
          else
            echo "- No Kubernetes drift detected" >> $GITHUB_STEP_SUMMARY
          fi

          echo "drift_detected=$DRIFT_DETECTED" >> $GITHUB_OUTPUT

      - name: Send notification
        if: steps.summary.outputs.drift_detected == 'true' && (inputs.notify_on_drift != false || github.event_name == 'schedule')
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "Infrastructure drift detected",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":warning: *Infrastructure Drift Detected*\n\nConfiguration drift has been detected between the expected state and actual infrastructure.\n\n*Details:* ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\n\nPlease review the drift report and take appropriate action."
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Trigger:*\n${{ github.event_name }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Time:*\n$(date -u +%Y-%m-%dT%H:%M:%SZ)"
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Create issue for drift
        if: steps.summary.outputs.drift_detected == 'true' && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Infrastructure Drift Detected - ${new Date().toISOString().split('T')[0]}`;

            // Check if issue already exists
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'drift-detection'
            });

            const existingIssue = issues.data.find(i => i.title === title);
            if (existingIssue) {
              console.log('Issue already exists:', existingIssue.html_url);
              return;
            }

            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: `## Infrastructure Drift Detected

            The scheduled drift detection workflow has found configuration differences between the expected infrastructure state and actual deployed resources.

            ### Details
            - **Run ID:** ${{ github.run_id }}
            - **Workflow URL:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            - **Detection Time:** ${new Date().toISOString()}

            ### Actions Required
            1. Review the drift report artifacts in the workflow run
            2. Determine if the drift is intentional or accidental
            3. Either:
               - Update Terraform/Helm configurations to match desired state
               - Apply Terraform/Helm to remediate drift
            4. Close this issue once resolved

            ### Labels
            - \`drift-detection\`
            - \`infrastructure\`
            `,
              labels: ['drift-detection', 'infrastructure', 'needs-triage']
            });

            console.log('Issue created:', issue.data.html_url);

name: Chaos Engineering Tests

on:
  push:
    branches: [main, develop]
    paths:
      - 'tests/chaos/**'
      - '.github/workflows/chaos-tests.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'tests/chaos/**'
      - '.github/workflows/chaos-tests.yml'
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Test suite to run'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - database
          - redis
          - services
          - cascading
          - degradation
          - recovery

jobs:
  chaos-tests:
    name: Chaos Engineering Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tests/package-lock.json

      - name: Install dependencies
        working-directory: tests
        run: npm ci

      - name: Create reports directory
        run: mkdir -p tests/reports/chaos

      - name: Run chaos tests
        id: chaos_tests
        shell: bash
        working-directory: tests
        run: |
          set +e

          TEST_SUITE="${{ github.event.inputs.test_suite || 'all' }}"

          if [ "$TEST_SUITE" = "all" ]; then
            npm run test:chaos 2>&1 | tee reports/chaos/test-output.txt
          else
            npm run "test:chaos:$TEST_SUITE" 2>&1 | tee reports/chaos/test-output.txt
          fi

          TEST_EXIT_CODE=${PIPESTATUS[0]}

          echo "exit_code=$TEST_EXIT_CODE" >> $GITHUB_OUTPUT

          if [ $TEST_EXIT_CODE -eq 0 ]; then
            echo "status=passed" >> $GITHUB_OUTPUT
            echo "## ✅ Chaos Tests Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "status=failed" >> $GITHUB_OUTPUT
            echo "## ❌ Chaos Tests Failed" >> $GITHUB_STEP_SUMMARY
          fi

          # Parse test results
          TOTAL=$(grep -oP 'Tests: \K\d+' reports/chaos/test-output.txt | head -1 || echo "0")
          PASSED=$(grep -oP '\K\d+(?= passed)' reports/chaos/test-output.txt | head -1 || echo "0")
          FAILED=$(grep -oP '\K\d+(?= failed)' reports/chaos/test-output.txt | head -1 || echo "0")
          SKIPPED=$(grep -oP '\K\d+(?= skipped)' reports/chaos/test-output.txt | head -1 || echo "0")

          echo "total=$TOTAL" >> $GITHUB_OUTPUT
          echo "passed=$PASSED" >> $GITHUB_OUTPUT
          echo "failed=$FAILED" >> $GITHUB_OUTPUT
          echo "skipped=$SKIPPED" >> $GITHUB_OUTPUT

          # Add summary table
          cat >> $GITHUB_STEP_SUMMARY << EOF

          ### Test Results

          | Metric | Count |
          |--------|-------|
          | Total Tests | $TOTAL |
          | Passed | $PASSED |
          | Failed | $FAILED |
          | Skipped | $SKIPPED |

          ### Test Suites

          | Suite | Description |
          |-------|-------------|
          | Database Failures | PostgreSQL failure scenarios |
          | Redis Failures | Cache unavailability and degradation |
          | Service Failures | Individual microservice failures |
          | Cascading Failures | Multi-service failure propagation |
          | Graceful Degradation | System behavior under partial failures |
          | Recovery Scenarios | Service recovery and health progression |
          EOF

          exit $TEST_EXIT_CODE

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chaos-test-results
          path: |
            tests/reports/chaos/
          retention-days: 14

      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ steps.chaos_tests.outputs.status }}';
            const total = '${{ steps.chaos_tests.outputs.total }}';
            const passed = '${{ steps.chaos_tests.outputs.passed }}';
            const failed = '${{ steps.chaos_tests.outputs.failed }}';
            const skipped = '${{ steps.chaos_tests.outputs.skipped }}';

            const statusEmoji = status === 'passed' ? '✅' : '❌';
            const statusText = status === 'passed' ? 'Passed' : 'Failed';

            const body = `## ${statusEmoji} Chaos Engineering Test Results

            | Metric | Count |
            |--------|-------|
            | **Status** | ${statusText} |
            | Total Tests | ${total} |
            | Passed | ${passed} |
            | Failed | ${failed} |
            | Skipped | ${skipped} |

            ### Test Coverage

            These tests validate system resilience under:
            - 🗄️ Database failures (PostgreSQL unavailability, timeouts, slow queries)
            - 📦 Cache failures (Redis unavailability, cluster splits)
            - 🔧 Service failures (Auth, Session, AI Detection, Eye Tracking, Video)
            - 🔗 Cascading failures (dependency chain failures, network partitions)
            - 📉 Graceful degradation (feature degradation, fallback mechanisms)
            - 🔄 Recovery scenarios (single/multi-service recovery, RTO tracking)

            <details>
            <summary>View detailed results</summary>

            \`\`\`
            Test run completed with exit code: ${{ steps.chaos_tests.outputs.exit_code }}
            \`\`\`

            </details>

            ---
            *Generated by Chaos Engineering Tests workflow*`;

            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existingComment = comments.find(c =>
              c.body.includes('Chaos Engineering Test Results') &&
              c.user.type === 'Bot'
            );

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }

      - name: Fail if tests failed
        if: steps.chaos_tests.outputs.status == 'failed'
        run: exit 1

  notify-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: chaos-tests
    if: failure() && github.ref == 'refs/heads/main'

    steps:
      - name: Send failure notification
        run: |
          echo "Chaos tests failed on main branch!"
          echo "This would trigger a Slack/email notification in production"
          # Add actual notification logic here (Slack webhook, email, etc.)

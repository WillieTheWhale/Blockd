name: Deploy to Production (Blue-Green)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_reason:
        description: 'Reason for deployment (required for audit)'
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/blockd
  HELM_VERSION: '3.13.0'
  KUBECTL_VERSION: '1.28.0'

jobs:
  approval:
    name: Manual Approval
    runs-on: ubuntu-latest
    environment:
      name: production-approval
    steps:
      - name: Request approval
        run: |
          echo "Deployment to production requires manual approval"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Author: ${{ github.actor }}"

  run-migrations:
    name: Run Database Migrations
    runs-on: ubuntu-latest
    needs: [approval]
    environment:
      name: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v${{ env.KUBECTL_VERSION }}

      - name: Configure kubectl for EKS
        run: |
          aws eks update-kubeconfig --name blockd-production-cluster --region us-east-1

      - name: Create migration job
        run: |
          # Generate unique job name
          JOB_NAME="db-migration-${{ github.run_id }}"

          # Create migration job manifest
          cat <<EOF | kubectl apply -f -
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: $JOB_NAME
            namespace: production
            labels:
              app: db-migration
              run-id: "${{ github.run_id }}"
          spec:
            ttlSecondsAfterFinished: 3600
            backoffLimit: 3
            template:
              spec:
                restartPolicy: Never
                securityContext:
                  runAsNonRoot: true
                  runAsUser: 1000
                  fsGroup: 1000
                  seccompProfile:
                    type: RuntimeDefault
                containers:
                  - name: prisma-migrate
                    image: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/api-gateway:${{ github.sha }}
                    command: ["npx"]
                    args: ["prisma", "migrate", "deploy"]
                    securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                        drop:
                          - ALL
                      readOnlyRootFilesystem: false
                    env:
                      - name: DATABASE_URL
                        valueFrom:
                          secretKeyRef:
                            name: database-credentials
                            key: url
                    resources:
                      requests:
                        cpu: 100m
                        memory: 256Mi
                      limits:
                        cpu: 500m
                        memory: 512Mi
          EOF

          echo "JOB_NAME=$JOB_NAME" >> $GITHUB_ENV

      - name: Wait for migration to complete
        run: |
          echo "Waiting for database migration to complete..."

          # Wait for job completion (timeout 10 minutes)
          kubectl wait --for=condition=complete --timeout=600s \
            job/${{ env.JOB_NAME }} -n production || \
          kubectl wait --for=condition=failed --timeout=10s \
            job/${{ env.JOB_NAME }} -n production

          # Check if migration succeeded
          STATUS=$(kubectl get job ${{ env.JOB_NAME }} -n production -o jsonpath='{.status.succeeded}')
          if [ "$STATUS" != "1" ]; then
            echo "Migration failed!"
            kubectl logs job/${{ env.JOB_NAME }} -n production
            exit 1
          fi

          echo "Migration completed successfully!"

      - name: Get migration logs
        if: always()
        run: |
          kubectl logs job/${{ env.JOB_NAME }} -n production || true

      - name: Cleanup migration job on failure
        if: failure()
        run: |
          kubectl delete job ${{ env.JOB_NAME }} -n production || true

  deploy-green:
    name: Deploy Green Environment
    runs-on: ubuntu-latest
    needs: [approval, run-migrations]
    environment:
      name: production
      url: https://blockd.io

    outputs:
      green_version: ${{ steps.version.outputs.green_version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v${{ env.KUBECTL_VERSION }}

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v${{ env.HELM_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Configure kubectl for EKS
        run: |
          aws eks update-kubeconfig --name blockd-production-cluster --region us-east-1

      - name: Determine current active environment
        id: current
        run: |
          ACTIVE=$(kubectl get service api-gateway -n production -o jsonpath='{.spec.selector.version}' || echo "blue")
          echo "Current active environment: $ACTIVE"
          echo "active=$ACTIVE" >> $GITHUB_OUTPUT

          if [ "$ACTIVE" == "blue" ]; then
            echo "target=green" >> $GITHUB_OUTPUT
          else
            echo "target=blue" >> $GITHUB_OUTPUT
          fi

      - name: Set version identifier
        id: version
        run: |
          VERSION="${{ github.ref_name }}-${{ github.sha }}"
          echo "green_version=$VERSION" >> $GITHUB_OUTPUT
          echo "Deploying version: $VERSION"

      - name: Create namespace if not exists
        run: |
          kubectl create namespace production --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy green environment with Helm
        run: |
          helm upgrade --install blockd-${{ steps.current.outputs.target }} ./k8s/helm/blockd \
            --namespace production \
            --values k8s/helm/blockd/values-production.yaml \
            --set image.tag=${{ steps.version.outputs.green_version }} \
            --set image.repository=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }} \
            --set environment=production \
            --set deployment.version=${{ steps.current.outputs.target }} \
            --set nameOverride=blockd-${{ steps.current.outputs.target }} \
            --wait \
            --timeout 15m \
            --atomic

      - name: Wait for green deployment to be ready
        run: |
          kubectl wait --for=condition=available --timeout=10m \
            deployment/api-gateway-${{ steps.current.outputs.target }} -n production
          kubectl wait --for=condition=available --timeout=10m \
            deployment/auth-service-${{ steps.current.outputs.target }} -n production
          kubectl wait --for=condition=available --timeout=10m \
            deployment/session-service-${{ steps.current.outputs.target }} -n production
          kubectl wait --for=condition=available --timeout=10m \
            deployment/websocket-service-${{ steps.current.outputs.target }} -n production
          kubectl wait --for=condition=available --timeout=10m \
            deployment/ai-detection-${{ steps.current.outputs.target }} -n production
          kubectl wait --for=condition=available --timeout=10m \
            deployment/eye-tracking-${{ steps.current.outputs.target }} -n production
          kubectl wait --for=condition=available --timeout=10m \
            deployment/response-timing-${{ steps.current.outputs.target }} -n production
          kubectl wait --for=condition=available --timeout=10m \
            deployment/video-service-${{ steps.current.outputs.target }} -n production
          kubectl wait --for=condition=available --timeout=10m \
            deployment/frontend-${{ steps.current.outputs.target }} -n production

      - name: Run smoke tests on green environment
        run: |
          echo "Running smoke tests on green environment..."

          # Get green service endpoints (internal cluster IPs)
          GREEN_API_URL="http://api-gateway-${{ steps.current.outputs.target }}.production.svc.cluster.local"

          # Create a test pod to run smoke tests from within the cluster
          kubectl run smoke-test-${{ github.run_id }} \
            --image=curlimages/curl:latest \
            --rm -i --restart=Never \
            --namespace production \
            -- sh -c "
              echo 'Testing API Gateway health...'
              curl -f $GREEN_API_URL/health || exit 1

              echo 'Testing Auth Service...'
              curl -f $GREEN_API_URL/auth/health || exit 1

              echo 'Testing Session Service...'
              curl -f $GREEN_API_URL/sessions/health || exit 1

              echo 'All smoke tests passed!'
            "

      - name: Run full integration tests on green
        run: |
          npm install -g newman

          # Port-forward to green environment for testing
          kubectl port-forward service/api-gateway-${{ steps.current.outputs.target }} 8080:80 -n production &
          PF_PID=$!
          sleep 10

          # Run Newman tests
          newman run tests/api/postman-collections/auth-api.postman_collection.json \
            --env-var baseUrl=http://localhost:8080 \
            --bail

          kill $PF_PID

  switch-traffic:
    name: Switch Traffic to Green
    runs-on: ubuntu-latest
    needs: [deploy-green]
    environment:
      name: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v${{ env.KUBECTL_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Configure kubectl for EKS
        run: |
          aws eks update-kubeconfig --name blockd-production-cluster --region us-east-1

      - name: Determine environments
        id: envs
        run: |
          ACTIVE=$(kubectl get service api-gateway -n production -o jsonpath='{.spec.selector.version}' || echo "blue")
          echo "Current active: $ACTIVE"
          echo "active=$ACTIVE" >> $GITHUB_OUTPUT

          if [ "$ACTIVE" == "blue" ]; then
            echo "new=green" >> $GITHUB_OUTPUT
            echo "old=blue" >> $GITHUB_OUTPUT
          else
            echo "new=blue" >> $GITHUB_OUTPUT
            echo "old=green" >> $GITHUB_OUTPUT
          fi

      - name: Switch service selectors to green
        run: |
          # Update service selectors to point to green deployment
          kubectl patch service api-gateway -n production -p '{"spec":{"selector":{"version":"${{ steps.envs.outputs.new }}"}}}'
          kubectl patch service auth-service -n production -p '{"spec":{"selector":{"version":"${{ steps.envs.outputs.new }}"}}}'
          kubectl patch service session-service -n production -p '{"spec":{"selector":{"version":"${{ steps.envs.outputs.new }}"}}}'
          kubectl patch service websocket-service -n production -p '{"spec":{"selector":{"version":"${{ steps.envs.outputs.new }}"}}}'
          kubectl patch service ai-detection -n production -p '{"spec":{"selector":{"version":"${{ steps.envs.outputs.new }}"}}}'
          kubectl patch service eye-tracking -n production -p '{"spec":{"selector":{"version":"${{ steps.envs.outputs.new }}"}}}'
          kubectl patch service response-timing -n production -p '{"spec":{"selector":{"version":"${{ steps.envs.outputs.new }}"}}}'
          kubectl patch service video-service -n production -p '{"spec":{"selector":{"version":"${{ steps.envs.outputs.new }}"}}}'
          kubectl patch service frontend -n production -p '{"spec":{"selector":{"version":"${{ steps.envs.outputs.new }}"}}}'

          echo "Traffic switched to ${{ steps.envs.outputs.new }} environment"

      - name: Run post-switch smoke tests
        run: |
          echo "Running comprehensive smoke tests after traffic switch..."
          PROD_URL="https://blockd.io"
          FAILED=0

          # Test all critical endpoints
          echo "Testing API Gateway..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -m 10 $PROD_URL/api/health)
          if [ "$HTTP_CODE" != "200" ]; then
            echo "ERROR: API Gateway health check failed with status $HTTP_CODE"
            FAILED=1
          fi

          echo "Testing Auth Service..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -m 10 $PROD_URL/api/auth/health)
          if [ "$HTTP_CODE" != "200" ]; then
            echo "ERROR: Auth Service health check failed with status $HTTP_CODE"
            FAILED=1
          fi

          echo "Testing Session Service..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -m 10 $PROD_URL/api/sessions/health)
          if [ "$HTTP_CODE" != "200" ]; then
            echo "ERROR: Session Service health check failed with status $HTTP_CODE"
            FAILED=1
          fi

          echo "Testing AI Detection Service..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -m 10 $PROD_URL/api/detection/health)
          if [ "$HTTP_CODE" != "200" ]; then
            echo "ERROR: AI Detection health check failed with status $HTTP_CODE"
            FAILED=1
          fi

          echo "Testing Video Service..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -m 10 $PROD_URL/api/video/health)
          if [ "$HTTP_CODE" != "200" ]; then
            echo "ERROR: Video Service health check failed with status $HTTP_CODE"
            FAILED=1
          fi

          echo "Testing WebSocket connectivity..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -m 10 $PROD_URL/api/ws/health)
          if [ "$HTTP_CODE" != "200" ]; then
            echo "ERROR: WebSocket health check failed with status $HTTP_CODE"
            FAILED=1
          fi

          echo "Testing Frontend..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -m 10 $PROD_URL/)
          if [ "$HTTP_CODE" != "200" ]; then
            echo "ERROR: Frontend health check failed with status $HTTP_CODE"
            FAILED=1
          fi

          if [ $FAILED -eq 1 ]; then
            echo "Smoke tests FAILED - triggering rollback"
            exit 1
          fi

          echo "All smoke tests passed!"

      - name: Query Prometheus for error rates
        run: |
          echo "Querying Prometheus for error rate metrics..."
          PROMETHEUS_URL="http://prometheus.monitoring.svc.cluster.local:9090"

          # Port-forward to Prometheus
          kubectl port-forward -n monitoring svc/prometheus-operated 9090:9090 &
          PF_PID=$!
          sleep 5

          # Query error rate for the last 2 minutes
          ERROR_RATE=$(curl -s "http://localhost:9090/api/v1/query" \
            --data-urlencode 'query=sum(rate(http_requests_total{status=~"5..",namespace="production"}[2m])) / sum(rate(http_requests_total{namespace="production"}[2m])) * 100' \
            | jq -r '.data.result[0].value[1] // "0"')

          kill $PF_PID 2>/dev/null || true

          echo "Current error rate: ${ERROR_RATE}%"

          # Fail if error rate > 1%
          if [ "$(echo "$ERROR_RATE > 1" | bc -l)" -eq 1 ]; then
            echo "ERROR: Error rate ${ERROR_RATE}% exceeds 1% threshold"
            exit 1
          fi

          echo "Error rate is within acceptable limits"

      - name: Monitor metrics for 5 minutes
        run: |
          echo "Monitoring application health for 5 minutes..."
          START_TIME=$(date +%s)
          END_TIME=$((START_TIME + 300))

          while [ $(date +%s) -lt $END_TIME ]; do
            # Check if all pods are running
            FAILED_PODS=$(kubectl get pods -n production -l version=${{ steps.envs.outputs.new }} --field-selector=status.phase!=Running --no-headers | wc -l)

            if [ $FAILED_PODS -gt 0 ]; then
              echo "ERROR: Found $FAILED_PODS failed pods!"
              kubectl get pods -n production -l version=${{ steps.envs.outputs.new }}
              exit 1
            fi

            # Check restarts
            RESTARTING_PODS=$(kubectl get pods -n production -l version=${{ steps.envs.outputs.new }} -o jsonpath='{.items[*].status.containerStatuses[*].restartCount}' | tr ' ' '\n' | awk '{sum+=$1} END {print sum}')
            if [ "$RESTARTING_PODS" -gt 5 ]; then
              echo "ERROR: High restart count detected: $RESTARTING_PODS"
              exit 1
            fi

            echo "Health check passed at $(date)"
            sleep 30
          done

          echo "Monitoring period completed successfully"

      - name: Rollback on failure
        if: failure()
        run: |
          echo "ERROR: Deployment failed, rolling back to ${{ steps.envs.outputs.old }}..."

          # Switch back to old environment
          kubectl patch service api-gateway -n production -p '{"spec":{"selector":{"version":"${{ steps.envs.outputs.old }}"}}}'
          kubectl patch service auth-service -n production -p '{"spec":{"selector":{"version":"${{ steps.envs.outputs.old }}"}}}'
          kubectl patch service session-service -n production -p '{"spec":{"selector":{"version":"${{ steps.envs.outputs.old }}"}}}'
          kubectl patch service websocket-service -n production -p '{"spec":{"selector":{"version":"${{ steps.envs.outputs.old }}"}}}'
          kubectl patch service ai-detection -n production -p '{"spec":{"selector":{"version":"${{ steps.envs.outputs.old }}"}}}'
          kubectl patch service eye-tracking -n production -p '{"spec":{"selector":{"version":"${{ steps.envs.outputs.old }}"}}}'
          kubectl patch service response-timing -n production -p '{"spec":{"selector":{"version":"${{ steps.envs.outputs.old }}"}}}'
          kubectl patch service video-service -n production -p '{"spec":{"selector":{"version":"${{ steps.envs.outputs.old }}"}}}'
          kubectl patch service frontend -n production -p '{"spec":{"selector":{"version":"${{ steps.envs.outputs.old }}"}}}'

          echo "Rollback completed"

  cleanup-old:
    name: Cleanup Old Environment
    runs-on: ubuntu-latest
    needs: [switch-traffic]

    steps:
      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v${{ env.KUBECTL_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Configure kubectl for EKS
        run: |
          aws eks update-kubeconfig --name blockd-production-cluster --region us-east-1

      - name: Scale down old deployment
        run: |
          # Keep old deployment for quick rollback, but scale down to save resources
          echo "Scaling down old blue deployment to 1 replica..."
          kubectl scale deployment --all -n production -l version=blue --replicas=1 || true

          echo "Old environment scaled down (kept for quick rollback)"

  notify:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: [switch-traffic]
    if: always()

    steps:
      - name: Send success notification
        if: needs.switch-traffic.result == 'success'
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "Production deployment successful",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":rocket: *Production Deployment Successful*\n*Version:* ${{ needs.deploy-green.outputs.green_version }}\n*Branch:* ${{ github.ref_name }}\n*Commit:* ${{ github.sha }}\n*Author:* ${{ github.actor }}\n*URL:* https://blockd.io"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Send failure notification
        if: needs.switch-traffic.result == 'failure'
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "Production deployment failed and was rolled back",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":x: *Production Deployment Failed*\n*Branch:* ${{ github.ref_name }}\n*Commit:* ${{ github.sha }}\n*Author:* ${{ github.actor }}\n*Status:* Rolled back to previous version\n*URL:* ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

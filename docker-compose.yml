version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: blockd-postgres
    environment:
      POSTGRES_DB: blockd_db
      POSTGRES_USER: blockd
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blockd"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - blockd-network

  # Authentication Service
  auth-service:
    build:
      context: .
      dockerfile: backend/services/auth/Dockerfile
    container_name: blockd-auth-service
    ports:
      - "8001:8001"
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - JWT_SECRET=dev-secret-key-change-in-production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=blockd_db
      - DB_USER=blockd
      - DB_PASSWORD=password
      - CORS_ORIGINS=["http://localhost:3000","http://localhost:8000"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - blockd-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  blockd-network:
    driver: bridge

# Blockd Platform Docker Compose
# IMPORTANT: Copy .env.example to .env and configure secrets before running in production
# Default credentials are for LOCAL DEVELOPMENT ONLY

services:
  # Database Services
  postgres:
    image: pgvector/pgvector:pg16
    container_name: blockd-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-blockd}
      POSTGRES_USER: ${POSTGRES_USER:-blockd_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_INITDB_ARGS: "-E UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    networks:
      - blockd-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-blockd_user} -d ${POSTGRES_DB:-blockd}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: blockd-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - blockd-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # RabbitMQ Message Queue
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: blockd-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-blockd_mq}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-blockd}
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - blockd-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # MinIO Object Storage (S3-compatible)
  minio:
    image: minio/minio:latest
    container_name: blockd-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-blockd_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Console UI
    volumes:
      - minio_data:/data
    networks:
      - blockd-network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # API Gateway (Node.js)
  api-gateway:
    build:
      context: ./backend
      dockerfile: api-gateway/Dockerfile
    container_name: blockd-api-gateway
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-blockd_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-blockd}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-blockd_mq}:${RABBITMQ_PASSWORD}@rabbitmq:5672/${RABBITMQ_VHOST:-blockd}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      AUTH_SERVICE_URL: http://auth-service:3001
      SESSION_SERVICE_URL: http://session-service:3002
      # CORS Configuration
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3004,http://localhost:5173,http://localhost:5174}
      CORS_ALLOW_NO_ORIGIN: ${CORS_ALLOW_NO_ORIGIN:-true}
      # OAuth Configuration
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-http://localhost:5174/auth/callback}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      MICROSOFT_CALLBACK_URL: ${MICROSOFT_CALLBACK_URL:-http://localhost:5174/auth/callback}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - blockd-network
    volumes:
      - ./backend/api-gateway:/app
      - /app/node_modules
    command: npm run dev
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  # Auth Service (Node.js)
  auth-service:
    build:
      context: ./backend/auth-service
      dockerfile: Dockerfile.dev
    container_name: blockd-auth-service
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-blockd_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-blockd}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRY: ${JWT_EXPIRY:-1h}
      REFRESH_TOKEN_EXPIRY: ${REFRESH_TOKEN_EXPIRY:-7d}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5174}
      # OAuth Configuration
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-http://localhost:5174/auth/callback}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      MICROSOFT_CALLBACK_URL: ${MICROSOFT_CALLBACK_URL:-http://localhost:5174/auth/callback}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - blockd-network
    volumes:
      - ./backend/auth-service/src:/app/src
      - ./backend/auth-service/controllers:/app/controllers
      - ./backend/auth-service/services:/app/services
      - ./backend/auth-service/middleware:/app/middleware
      - ./backend/auth-service/lib:/app/lib
      - ./backend/auth-service/types:/app/types
    command: npm run dev
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  # Session Service (Node.js)
  session-service:
    build:
      context: ./backend/session-service
      dockerfile: Dockerfile.dev
    container_name: blockd-session-service
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3002
      DATABASE_URL: postgresql://${POSTGRES_USER:-blockd_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-blockd}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-blockd_mq}:${RABBITMQ_PASSWORD}@rabbitmq:5672/${RABBITMQ_VHOST:-blockd}
    ports:
      - "3002:3002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - blockd-network
    volumes:
      - ./backend/session-service/src:/app/src
      - ./backend/session-service/lib:/app/lib
      - ./backend/shared:/shared
    command: npm run dev
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  # AI Detection Service (Python)
  ai-detection:
    build:
      context: ./backend/ai-detection
      dockerfile: Dockerfile
    container_name: blockd-ai-detection
    environment:
      PYTHONUNBUFFERED: 1
      DATABASE_URL: postgresql://${POSTGRES_USER:-blockd_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-blockd}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-blockd_mq}:${RABBITMQ_PASSWORD}@rabbitmq:5672/${RABBITMQ_VHOST:-blockd}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - blockd-network
    volumes:
      - ./backend/ai-detection:/app
      - ai_models:/app/models
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 2G

  # Eye Tracking Service (Python)
  eye-tracking:
    build:
      context: ./backend/eye-tracking
      dockerfile: Dockerfile
    container_name: blockd-eye-tracking
    environment:
      PYTHONUNBUFFERED: 1
      DATABASE_URL: postgresql://${POSTGRES_USER:-blockd_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-blockd}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-blockd_mq}:${RABBITMQ_PASSWORD}@rabbitmq:5672/${RABBITMQ_VHOST:-blockd}
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - blockd-network
    volumes:
      - ./backend/eye-tracking:/app
      - eye_tracking_models:/app/models
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G

  # Response Timing Service (Python)
  response-timing:
    build:
      context: ./backend/response-timing
      dockerfile: Dockerfile
    container_name: blockd-response-timing
    environment:
      PYTHONUNBUFFERED: 1
      DATABASE_URL: postgresql://${POSTGRES_USER:-blockd_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-blockd}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-blockd_mq}:${RABBITMQ_PASSWORD}@rabbitmq:5672/${RABBITMQ_VHOST:-blockd}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - blockd-network
    volumes:
      - ./backend/response-timing:/app
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G

  # Video Service (Python with FFmpeg)
  video-service:
    build:
      context: ./backend/video-service
      dockerfile: Dockerfile
    container_name: blockd-video-service
    environment:
      PYTHONUNBUFFERED: 1
      DATABASE_URL: postgresql://${POSTGRES_USER:-blockd_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-blockd}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-blockd_mq}:${RABBITMQ_PASSWORD}@rabbitmq:5672/${RABBITMQ_VHOST:-blockd}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-blockd_minio}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-blockd-videos}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_USE_SSL: "false"
    ports:
      - "8003:8003"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - blockd-network
    volumes:
      - ./backend/video-service:/app
      - video_recordings:/app/recordings
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 2G

  # Frontend Interviewer App
  frontend:
    build:
      context: ./frontend/interviewer-app
      dockerfile: Dockerfile
    container_name: blockd-frontend
    environment:
      # Note: Do NOT include /api/v1 - the frontend code already adds it to endpoint paths
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
      VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:3000}
    ports:
      - "5173:80"
    depends_on:
      - api-gateway
    networks:
      - blockd-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M

networks:
  blockd-network:
    driver: bridge
    name: blockd-network

volumes:
  postgres_data:
    name: blockd-postgres-data
  redis_data:
    name: blockd-redis-data
  rabbitmq_data:
    name: blockd-rabbitmq-data
  minio_data:
    name: blockd-minio-data
  ai_models:
    name: blockd-ai-models
  eye_tracking_models:
    name: blockd-eye-tracking-models
  video_recordings:
    name: blockd-video-recordings

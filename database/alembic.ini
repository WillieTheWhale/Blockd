# Alembic Configuration for Blockd Platform
# PostgreSQL 18.1 with TimescaleDB and pgvector

[alembic]
# Path to migration scripts
script_location = migrations

# Template used to generate migration files
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone for migration timestamps
timezone = UTC

# Prepend sys.path with the specified value (for imports to work)
prepend_sys_path = .

# Version location
version_locations = migrations/versions

# Output encoding
output_encoding = utf-8

# Database connection string (override with environment variable)
# Format: postgresql://user:password@host:port/database
sqlalchemy.url = postgresql://postgres:postgres@localhost:5432/blockd

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

# Blockd Database Docker Compose Configuration
# Copy this to docker-compose.yml and customize as needed

version: '3.8'

services:
  postgres:
    # Using TimescaleDB image which includes PostgreSQL + TimescaleDB extension
    image: timescale/timescaledb-ha:pg15-latest
    container_name: blockd_postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: blockd
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}  # Change in production!
      POSTGRES_DB: blockd_db
      PGDATA: /var/lib/postgresql/data/pgdata

    ports:
      - "${DB_PORT:-5432}:5432"

    volumes:
      # Database data persistence
      - postgres_data:/var/lib/postgresql/data

      # Initialization scripts (run in alphabetical order)
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./schema.sql:/docker-entrypoint-initdb.d/02-schema.sql
      - ./permissions.sql:/docker-entrypoint-initdb.d/03-permissions.sql

      # Optional: Custom PostgreSQL configuration
      # - ./postgresql.conf:/etc/postgresql/postgresql.conf

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blockd -d blockd_db"]
      interval: 10s
      timeout: 5s
      retries: 5

    # Resource limits (adjust based on your needs)
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

    networks:
      - blockd_network


  # Optional: pgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: blockd_pgadmin
    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@blockd.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'

    ports:
      - "5050:80"

    volumes:
      - pgadmin_data:/var/lib/pgadmin

    networks:
      - blockd_network

    depends_on:
      - postgres


volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local


networks:
  blockd_network:
    driver: bridge


# Usage:
# 1. Copy this file: cp docker-compose.example.yml docker-compose.yml
# 2. Set environment variables in .env file
# 3. Start: docker-compose up -d
# 4. View logs: docker-compose logs -f postgres
# 5. Stop: docker-compose down
# 6. Access pgAdmin: http://localhost:5050
#
# Connection details:
#   Host: postgres
#   Port: 5432
#   Database: blockd_db
#   User: blockd
#   Password: password (or value from .env)

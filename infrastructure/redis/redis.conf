# Redis 8.4 Configuration for Blockd Platform
# Production-ready cluster configuration

# Network Configuration
bind 0.0.0.0
protected-mode yes
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

# General Configuration
daemonize no
supervised no
pidfile /var/run/redis_6379.pid
loglevel notice
logfile ""
databases 16

# Snapshotting (RDB) - Disabled in favor of AOF
save ""

# Replication
replica-serve-stale-data yes
replica-read-only yes
repl-diskless-sync no
repl-diskless-sync-delay 5
repl-disable-tcp-nodelay no
replica-priority 100

# Memory Management
maxmemory 64gb
maxmemory-policy allkeys-lru
maxmemory-samples 5

# Lazy Freeing
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
replica-lazy-flush yes

# Append Only File (AOF) Persistence
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-load-truncated yes
aof-use-rdb-preamble yes

# Lua Scripting
lua-time-limit 5000

# Cluster Configuration
cluster-enabled yes
cluster-config-file nodes.conf
cluster-node-timeout 15000
cluster-replica-validity-factor 10
cluster-migration-barrier 1
cluster-require-full-coverage yes
cluster-replica-no-failover no
cluster-allow-reads-when-down no

# Slow Log
slowlog-log-slower-than 10000
slowlog-max-len 128

# Latency Monitor
latency-monitor-threshold 100

# Event Notification
notify-keyspace-events "Ex"

# Advanced Config
hash-max-ziplist-entries 512
hash-max-ziplist-value 64
list-max-ziplist-size -2
list-compress-depth 0
set-max-intset-entries 512
zset-max-ziplist-entries 128
zset-max-ziplist-value 64
hll-sparse-max-bytes 3000
stream-node-max-bytes 4096
stream-node-max-entries 100

# Active Rehashing
activerehashing yes

# Client Output Buffer Limits
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# Client Query Buffer
client-query-buffer-limit 1gb

# Protocol
proto-max-bulk-len 512mb

# Frequency
hz 10
dynamic-hz yes

# AOF Rewrite
aof-rewrite-incremental-fsync yes

# RDB
rdb-save-incremental-fsync yes

# LFU (Least Frequently Used) Configuration
lfu-log-factor 10
lfu-decay-time 1

# Active Defragmentation
activedefrag yes
active-defrag-ignore-bytes 100mb
active-defrag-threshold-lower 10
active-defrag-threshold-upper 25
active-defrag-cycle-min 1
active-defrag-cycle-max 25
active-defrag-max-scan-fields 1000

# Performance Tuning
io-threads 4
io-threads-do-reads yes

# Security Configuration
# IMPORTANT: These passwords MUST be set via environment variables in production
# The redis-server command line can override these with --requirepass and --masterauth
# In Kubernetes, use secrets to inject these values

# Authentication - REQUIRED for production
# Set via REDIS_PASSWORD environment variable or command line
requirepass ${REDIS_PASSWORD:-change_me_in_production}
masterauth ${REDIS_PASSWORD:-change_me_in_production}

# Disable dangerous commands in production
rename-command FLUSHDB "BLOCKD_FLUSHDB_RESTRICTED"
rename-command FLUSHALL "BLOCKD_FLUSHALL_RESTRICTED"
rename-command DEBUG ""
rename-command SHUTDOWN "BLOCKD_SHUTDOWN_RESTRICTED"
# Note: CONFIG is needed for cluster operations, use ACLs instead if available

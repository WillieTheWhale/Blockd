## RabbitMQ 4.x Configuration for Blockd Platform
## High-performance cluster configuration for video processing and AI workloads

## Cluster Configuration
cluster_formation.peer_discovery_backend = rabbit_peer_discovery_classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbitmq-node1
cluster_formation.classic_config.nodes.2 = rabbit@rabbitmq-node2
cluster_formation.classic_config.nodes.3 = rabbit@rabbitmq-node3

## Network Settings
listeners.tcp.default = 5672
management.tcp.port = 15672
management.cors.allow_origins.1 = *
management.load_definitions = /etc/rabbitmq/definitions.json

## Memory Management
## Total memory available (adjust based on your environment)
vm_memory_high_watermark.relative = 0.6
vm_memory_high_watermark_paging_ratio = 0.75

## Disk Free Space
disk_free_limit.absolute = 10GB

## Connection Limits
## High limits for video processing workloads
num_acceptors.tcp = 10
num_acceptors.ssl = 10
tcp_listen_options.backlog = 4096
tcp_listen_options.nodelay = true
tcp_listen_options.linger.on = true
tcp_listen_options.linger.timeout = 0
tcp_listen_options.exit_on_close = false

## Channel Limits
channel_max = 2048

## Connection Timeouts
heartbeat = 60
frame_max = 131072

## Queue Settings
## Default queue master locator strategy
queue_master_locator = min-masters

## Classic Mirroring (for compatibility)
## In RabbitMQ 4.x, prefer quorum queues over classic mirrored queues
classic_queue.default_version = 2

## Management Plugin
management.tcp.ip = 0.0.0.0
management.http_log_dir = /var/log/rabbitmq/management-http-access

## Prometheus Metrics
prometheus.return_per_object_metrics = true

## Logging
log.file.level = info
log.console = true
log.console.level = info
log.exchange.level = info

## Security
loopback_users = none

## Default User (change in production!)
default_vhost = blockd
default_user = blockd_user
default_pass = blockd_password_change_in_production

## Policies
## Apply HA policy to all queues
## ha-mode: exactly - replicate to N nodes
## ha-params: 2 - replicate to 2 nodes
## ha-sync-mode: automatic - sync new queues automatically

## Performance Tuning
## Credit flow control
credit_flow_default_credit = 400

## Collect statistics
collect_statistics = coarse
collect_statistics_interval = 10000

## Message TTL
## Default: no TTL
## Per-queue TTL should be set via policies or queue arguments

## Dead Letter Exchange
## Configured per-queue via topology definitions

## Plugins
## Enable required plugins via docker-compose or startup scripts:
## rabbitmq-plugins enable rabbitmq_management
## rabbitmq-plugins enable rabbitmq_prometheus
## rabbitmq-plugins enable rabbitmq_shovel
## rabbitmq-plugins enable rabbitmq_federation

## Queue Performance
queue_index_embed_msgs_below = 4096

## GC Settings
## Reduce GC pause times
runtime_parameters.gen_server2_gc_threshold = 10000

## Message Store
msg_store_file_size_limit = 16777216

## TLS/SSL (configure if needed)
# ssl_options.cacertfile = /path/to/ca_certificate.pem
# ssl_options.certfile = /path/to/server_certificate.pem
# ssl_options.keyfile = /path/to/server_key.pem
# ssl_options.verify = verify_peer
# ssl_options.fail_if_no_peer_cert = true

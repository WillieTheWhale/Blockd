version: '3.9'

services:
  rabbitmq-node1:
    image: rabbitmq:4-management-alpine
    hostname: rabbitmq-node1
    container_name: blockd-rabbitmq-node1
    environment:
      RABBITMQ_ERLANG_COOKIE: 'blockd_cluster_cookie_change_in_production'
      RABBITMQ_DEFAULT_USER: blockd_user
      RABBITMQ_DEFAULT_PASS: blockd_password_change_in_production
      RABBITMQ_DEFAULT_VHOST: blockd
      RABBITMQ_NODENAME: rabbit@rabbitmq-node1
    volumes:
      - rabbitmq-node1-data:/var/lib/rabbitmq
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./topology.json:/etc/rabbitmq/definitions.json:ro
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - rabbitmq-cluster
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  rabbitmq-node2:
    image: rabbitmq:4-management-alpine
    hostname: rabbitmq-node2
    container_name: blockd-rabbitmq-node2
    environment:
      RABBITMQ_ERLANG_COOKIE: 'blockd_cluster_cookie_change_in_production'
      RABBITMQ_DEFAULT_USER: blockd_user
      RABBITMQ_DEFAULT_PASS: blockd_password_change_in_production
      RABBITMQ_DEFAULT_VHOST: blockd
      RABBITMQ_NODENAME: rabbit@rabbitmq-node2
    volumes:
      - rabbitmq-node2-data:/var/lib/rabbitmq
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./topology.json:/etc/rabbitmq/definitions.json:ro
    ports:
      - "5673:5672"
      - "15673:15672"
    networks:
      - rabbitmq-cluster
    depends_on:
      rabbitmq-node1:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  rabbitmq-node3:
    image: rabbitmq:4-management-alpine
    hostname: rabbitmq-node3
    container_name: blockd-rabbitmq-node3
    environment:
      RABBITMQ_ERLANG_COOKIE: 'blockd_cluster_cookie_change_in_production'
      RABBITMQ_DEFAULT_USER: blockd_user
      RABBITMQ_DEFAULT_PASS: blockd_password_change_in_production
      RABBITMQ_DEFAULT_VHOST: blockd
      RABBITMQ_NODENAME: rabbit@rabbitmq-node3
    volumes:
      - rabbitmq-node3-data:/var/lib/rabbitmq
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./topology.json:/etc/rabbitmq/definitions.json:ro
    ports:
      - "5674:5672"
      - "15674:15672"
    networks:
      - rabbitmq-cluster
    depends_on:
      rabbitmq-node1:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  # Redis for Celery result backend
  redis:
    image: redis:8.4-alpine
    container_name: blockd-redis-celery
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    networks:
      - rabbitmq-cluster
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

networks:
  rabbitmq-cluster:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16

volumes:
  rabbitmq-node1-data:
    driver: local
  rabbitmq-node2-data:
    driver: local
  rabbitmq-node3-data:
    driver: local
  redis-data:
    driver: local

# External Secret for Application secrets (JWT, API keys, etc.)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: application-secrets
  namespace: production
spec:
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: blockd-secrets
    creationPolicy: Owner
  refreshInterval: 1h
  data:
    # Database
    - secretKey: database-url
      remoteRef:
        key: blockd-production-db-connection-string

    # Redis
    - secretKey: redis-url
      remoteRef:
        key: blockd-production-redis-connection-string

    # RabbitMQ
    - secretKey: rabbitmq-url
      remoteRef:
        key: blockd-production-rabbitmq-connection-string

    # JWT Secret
    - secretKey: jwt-secret
      remoteRef:
        key: blockd-production-jwt-secret

    # OpenAI API Key
    - secretKey: openai-api-key
      remoteRef:
        key: blockd-production-openai-api-key

    # Anthropic API Key
    - secretKey: anthropic-api-key
      remoteRef:
        key: blockd-production-anthropic-api-key

    # Google AI API Key
    - secretKey: google-api-key
      remoteRef:
        key: blockd-production-google-api-key

    # AWS Credentials for S3
    - secretKey: aws-access-key-id
      remoteRef:
        key: blockd-production-aws-access-key-id

    - secretKey: aws-secret-access-key
      remoteRef:
        key: blockd-production-aws-secret-access-key

    # OAuth Secrets
    - secretKey: google-oauth-client-id
      remoteRef:
        key: blockd-production-google-oauth-client-id

    - secretKey: google-oauth-client-secret
      remoteRef:
        key: blockd-production-google-oauth-client-secret

---
# Staging Application Secrets
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: application-secrets
  namespace: staging
spec:
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: blockd-secrets
    creationPolicy: Owner
  refreshInterval: 1h
  data:
    - secretKey: database-url
      remoteRef:
        key: blockd-staging-db-connection-string
    - secretKey: redis-url
      remoteRef:
        key: blockd-staging-redis-connection-string
    - secretKey: rabbitmq-url
      remoteRef:
        key: blockd-staging-rabbitmq-connection-string
    - secretKey: jwt-secret
      remoteRef:
        key: blockd-staging-jwt-secret
    - secretKey: openai-api-key
      remoteRef:
        key: blockd-staging-openai-api-key
    - secretKey: anthropic-api-key
      remoteRef:
        key: blockd-staging-anthropic-api-key
    - secretKey: google-api-key
      remoteRef:
        key: blockd-staging-google-api-key
    - secretKey: aws-access-key-id
      remoteRef:
        key: blockd-staging-aws-access-key-id
    - secretKey: aws-secret-access-key
      remoteRef:
        key: blockd-staging-aws-secret-access-key
    - secretKey: google-oauth-client-id
      remoteRef:
        key: blockd-staging-google-oauth-client-id
    - secretKey: google-oauth-client-secret
      remoteRef:
        key: blockd-staging-google-oauth-client-secret

# External Secret for Database credentials
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: database-credentials
  namespace: production
spec:
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: blockd-database-secret
    creationPolicy: Owner
  refreshInterval: 1h
  data:
    - secretKey: database-url
      remoteRef:
        key: blockd-production-db-connection-string
    - secretKey: database-password
      remoteRef:
        key: blockd-production-db-password

---
# Staging Database Secret
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: database-credentials
  namespace: staging
spec:
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: blockd-database-secret
    creationPolicy: Owner
  refreshInterval: 1h
  data:
    - secretKey: database-url
      remoteRef:
        key: blockd-staging-db-connection-string
    - secretKey: database-password
      remoteRef:
        key: blockd-staging-db-password

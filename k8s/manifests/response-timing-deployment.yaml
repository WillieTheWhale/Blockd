apiVersion: v1
kind: Service
metadata:
  name: response-timing
  namespace: blockd
  labels:
    app: response-timing
spec:
  type: ClusterIP
  ports:
    - port: 8002
      targetPort: 8002
      name: http
  selector:
    app: response-timing
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: response-timing
  namespace: blockd
  labels:
    app: response-timing
spec:
  replicas: 2
  selector:
    matchLabels:
      app: response-timing
  template:
    metadata:
      labels:
        app: response-timing
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: response-timing
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          image: blockd/response-timing:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8002
              name: http
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: blockd-secrets
                  key: database_url
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: blockd-secrets
                  key: rabbitmq_url
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: blockd-secrets
                  key: openai_api_key
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          startupProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 0
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

      ports:
        - protocol: TCP
          port: 3007
    # From Ingress (WebSocket connections)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 3007


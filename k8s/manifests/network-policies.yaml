    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: etcd
      ports:
        - protocol: TCP
          port: 2379
        - protocol: TCP
          port: 2380
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: etcd
      ports:
        - protocol: TCP
          port: 2379
        - protocol: TCP
          port: 2380


# Vertical Pod Autoscaler Configuration for Blockd Platform
# Automatically adjusts CPU and memory requests based on actual usage
#
# Prerequisites:
# 1. Install VPA: kubectl apply -f https://github.com/kubernetes/autoscaler/releases/download/vertical-pod-autoscaler-0.14.0/vpa-v0.14.0.yaml
# 2. Ensure metrics-server is running
#
# Modes:
# - Off: VPA only provides recommendations, no automatic updates
# - Initial: VPA only assigns resources on pod creation
# - Auto: VPA updates pod resources automatically (recreates pods)
---
# API Gateway VPA (Auto mode - stateless)
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: api-gateway-vpa
  namespace: blockd
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: blockd
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway
  updatePolicy:
    updateMode: "Auto"
    minReplicas: 2  # Don't update if only 2 replicas
  resourcePolicy:
    containerPolicies:
      - containerName: api-gateway
        minAllowed:
          cpu: 100m
          memory: 256Mi
        maxAllowed:
          cpu: 4000m
          memory: 8Gi
        controlledResources:
          - cpu
          - memory
        controlledValues: RequestsAndLimits

---

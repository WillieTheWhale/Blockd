metadata:
  name: websocket-service-vpa
  namespace: blockd
  labels:
    app.kubernetes.io/name: websocket-service
    app.kubernetes.io/part-of: blockd
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: websocket-service
  updatePolicy:
    updateMode: "Initial"  # Only on pod creation
  resourcePolicy:
    containerPolicies:
      - containerName: websocket-service
        minAllowed:
          cpu: 200m
          memory: 512Mi
        maxAllowed:
          cpu: 4000m
          memory: 8Gi
        controlledResources:
          - cpu
          - memory


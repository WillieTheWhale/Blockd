# Secrets Rotation Configuration for Blockd Platform
# Uses External Secrets Operator with automatic rotation
#
# Prerequisites:
# 1. External Secrets Operator installed
# 2. AWS Secrets Manager or HashiCorp Vault configured
# 3. ClusterSecretStore configured
---
# ClusterSecretStore for AWS Secrets Manager
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
  labels:
    app.kubernetes.io/part-of: blockd
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-sa
            namespace: external-secrets

---
# Database credentials with rotation
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: database-credentials
  namespace: blockd
  labels:
    app.kubernetes.io/part-of: blockd
    app.kubernetes.io/component: database
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: database-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      data:
        # Construct DATABASE_URL from components
        url: "postgresql://{{ .username }}:{{ .password }}@{{ .host }}:{{ .port }}/{{ .database }}?sslmode=require"
        username: "{{ .username }}"
        password: "{{ .password }}"
        host: "{{ .host }}"
        port: "{{ .port }}"
        database: "{{ .database }}"
  data:
    - secretKey: username
      remoteRef:
        key: blockd/production/database
        property: username
    - secretKey: password
      remoteRef:
        key: blockd/production/database
        property: password
    - secretKey: host
      remoteRef:
        key: blockd/production/database
        property: host
    - secretKey: port
      remoteRef:
        key: blockd/production/database
        property: port
    - secretKey: database
      remoteRef:
        key: blockd/production/database
        property: dbname

---
# Redis credentials with rotation
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: redis-credentials
  namespace: blockd
  labels:
    app.kubernetes.io/part-of: blockd
    app.kubernetes.io/component: cache
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: redis-credentials
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        url: "redis://:{{ .password }}@{{ .host }}:{{ .port }}"
        password: "{{ .password }}"
        host: "{{ .host }}"
        port: "{{ .port }}"
  data:
    - secretKey: password
      remoteRef:
        key: blockd/production/redis
        property: password
    - secretKey: host
      remoteRef:
        key: blockd/production/redis
        property: host
    - secretKey: port
      remoteRef:
        key: blockd/production/redis
        property: port

---
# RabbitMQ credentials with rotation
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: rabbitmq-credentials
  namespace: blockd
  labels:
    app.kubernetes.io/part-of: blockd
    app.kubernetes.io/component: messaging
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: rabbitmq-credentials
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        url: "amqp://{{ .username }}:{{ .password }}@{{ .host }}:{{ .port }}"
        username: "{{ .username }}"
        password: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef:
        key: blockd/production/rabbitmq
        property: username
    - secretKey: password
      remoteRef:
        key: blockd/production/rabbitmq
        property: password
    - secretKey: host
      remoteRef:
        key: blockd/production/rabbitmq
        property: host
    - secretKey: port
      remoteRef:
        key: blockd/production/rabbitmq
        property: port

---
# JWT signing keys with rotation
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: jwt-keys
  namespace: blockd
  labels:
    app.kubernetes.io/part-of: blockd
    app.kubernetes.io/component: auth
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: jwt-keys
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        private-key: "{{ .private_key }}"
        public-key: "{{ .public_key }}"
        # Previous key for graceful rotation
        previous-private-key: "{{ .previous_private_key | default .private_key }}"
        previous-public-key: "{{ .previous_public_key | default .public_key }}"
  data:
    - secretKey: private_key
      remoteRef:
        key: blockd/production/jwt
        property: private_key
    - secretKey: public_key
      remoteRef:
        key: blockd/production/jwt
        property: public_key
    - secretKey: previous_private_key
      remoteRef:
        key: blockd/production/jwt
        property: previous_private_key
    - secretKey: previous_public_key
      remoteRef:
        key: blockd/production/jwt
        property: previous_public_key

---
# API keys for external services
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: external-api-keys
  namespace: blockd
  labels:
    app.kubernetes.io/part-of: blockd
    app.kubernetes.io/component: integrations
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: external-api-keys
    creationPolicy: Owner
  data:
    - secretKey: openai-api-key
      remoteRef:
        key: blockd/production/api-keys
        property: openai_api_key
    - secretKey: anthropic-api-key
      remoteRef:
        key: blockd/production/api-keys
        property: anthropic_api_key
    - secretKey: google-api-key
      remoteRef:
        key: blockd/production/api-keys
        property: google_api_key
    - secretKey: sendgrid-api-key
      remoteRef:
        key: blockd/production/api-keys
        property: sendgrid_api_key
    - secretKey: twilio-api-key
      remoteRef:
        key: blockd/production/api-keys
        property: twilio_api_key

---
# OAuth client secrets
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: oauth-secrets
  namespace: blockd
  labels:
    app.kubernetes.io/part-of: blockd
    app.kubernetes.io/component: auth
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: oauth-secrets
    creationPolicy: Owner
  data:
    - secretKey: google-client-id
      remoteRef:
        key: blockd/production/oauth
        property: google_client_id
    - secretKey: google-client-secret
      remoteRef:
        key: blockd/production/oauth
        property: google_client_secret
    - secretKey: microsoft-client-id
      remoteRef:
        key: blockd/production/oauth
        property: microsoft_client_id
    - secretKey: microsoft-client-secret
      remoteRef:
        key: blockd/production/oauth
        property: microsoft_client_secret

---
# Encryption keys for data at rest
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: encryption-keys
  namespace: blockd
  labels:
    app.kubernetes.io/part-of: blockd
    app.kubernetes.io/component: security
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: encryption-keys
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        # Current encryption key
        current-key: "{{ .current_key }}"
        current-key-id: "{{ .current_key_id }}"
        # Previous key for decryption during rotation
        previous-key: "{{ .previous_key | default .current_key }}"
        previous-key-id: "{{ .previous_key_id | default .current_key_id }}"
  data:
    - secretKey: current_key
      remoteRef:
        key: blockd/production/encryption
        property: current_key
    - secretKey: current_key_id
      remoteRef:
        key: blockd/production/encryption
        property: current_key_id
    - secretKey: previous_key
      remoteRef:
        key: blockd/production/encryption
        property: previous_key
    - secretKey: previous_key_id
      remoteRef:
        key: blockd/production/encryption
        property: previous_key_id

---
# ServiceAccount for External Secrets with IRSA
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-sa
  namespace: external-secrets
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/blockd-external-secrets-role
  labels:
    app.kubernetes.io/part-of: blockd

---
# PushSecret for syncing secrets back to AWS (for rotation tracking)
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: rotation-tracker
  namespace: blockd
  labels:
    app.kubernetes.io/part-of: blockd
spec:
  refreshInterval: 1h
  secretStoreRefs:
    - name: aws-secrets-manager
      kind: ClusterSecretStore
  selector:
    secret:
      name: rotation-metadata
  data:
    - match:
        secretKey: last-rotation-time
        remoteRef:
          remoteKey: blockd/production/rotation-metadata
          property: last_rotation_time

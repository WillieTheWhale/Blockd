# Pod Disruption Budgets for Blockd Platform
# Ensures minimum availability during voluntary disruptions (node maintenance, cluster upgrades)
#
# Guidelines:
# - Services with 2+ replicas: minAvailable = 1 or maxUnavailable = 1
# - Critical services: minAvailable = 2 (requires 3+ replicas)
# - Use minAvailable for strict guarantees, maxUnavailable for flexibility
---
# API Gateway PDB - Critical entry point
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-gateway-pdb
  namespace: blockd
  labels:
    app: api-gateway
    app.kubernetes.io/part-of: blockd
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: api-gateway

---
# Auth Service PDB - Critical for authentication
apiVersion: policy/v1

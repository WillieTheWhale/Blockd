# Priority Classes for Blockd Platform
# Defines pod scheduling priorities for resource contention scenarios
#
# Priority values (higher = more important):
# - system-critical: 1000000000 (reserved for system components)
# - platform-critical: 900000 (core platform services)
# - high-priority: 500000 (business-critical services)
# - default: 0 (standard workloads)
# - batch: -100000 (background jobs, can be preempted)
---
# Critical platform services (database, redis, etc.)
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: blockd-platform-critical
  labels:
    app.kubernetes.io/part-of: blockd
description: "Critical platform infrastructure components (databases, message queues)"
value: 900000
preemptionPolicy: PreemptLowerPriority
globalDefault: false

---
# High priority services (API Gateway, Auth, Session)
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: blockd-high-priority
  labels:
    app.kubernetes.io/part-of: blockd
description: "High priority business services (API, Auth, Session management)"
value: 500000
preemptionPolicy: PreemptLowerPriority
globalDefault: false

---
# Default priority for standard workloads
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: blockd-default
  labels:
    app.kubernetes.io/part-of: blockd
description: "Default priority for standard Blockd workloads"
value: 0
preemptionPolicy: PreemptLowerPriority
globalDefault: true

---
# Low priority for batch jobs and non-critical background tasks
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: blockd-batch
  labels:
    app.kubernetes.io/part-of: blockd
description: "Low priority batch jobs and background tasks (can be preempted)"
value: -100000
preemptionPolicy: PreemptLowerPriority
globalDefault: false

---
# Real-time services (WebSocket, Video)
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: blockd-realtime
  labels:
    app.kubernetes.io/part-of: blockd
description: "Real-time services requiring low latency (WebSocket, Video)"
value: 600000
preemptionPolicy: PreemptLowerPriority
globalDefault: false

# Topology Spread Constraints for Blockd Platform
# Ensures high availability by spreading pods across zones and nodes
#
# This file provides reusable topology spread constraint templates
# that should be applied to service deployments
---
# Example: API Gateway with topology spread
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: blockd
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: blockd
    app.kubernetes.io/component: gateway
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-gateway
        app.kubernetes.io/part-of: blockd
        app.kubernetes.io/component: gateway
    spec:
      # Spread pods across availability zones
      topologySpreadConstraints:
        # Zone-level spread (hard constraint)
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: api-gateway
          minDomains: 2

        # Node-level spread (soft constraint)
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: api-gateway

      # Anti-affinity as backup
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: api-gateway
                topologyKey: kubernetes.io/hostname

      # Priority class
      priorityClassName: blockd-high-priority

      containers:
        - name: api-gateway
          image: ghcr.io/blockd/api-gateway:latest
          # ... container spec


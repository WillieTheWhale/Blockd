---
# Example: AI Detection (ML workload)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-detection
  namespace: blockd
  labels:
    app.kubernetes.io/name: ai-detection
    app.kubernetes.io/part-of: blockd
    app.kubernetes.io/component: ml
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-detection
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-detection
        app.kubernetes.io/part-of: blockd
        app.kubernetes.io/component: ml
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway  # ML can tolerate zone imbalance
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: ai-detection

        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: ai-detection

      # Schedule on GPU nodes if available
      nodeSelector:
        node.kubernetes.io/instance-type: "gpu"
      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Exists"
          effect: "NoSchedule"

      priorityClassName: blockd-default

      containers:
        - name: ai-detection
          image: ghcr.io/blockd/ai-detection:latest
          resources:
            limits:
              nvidia.com/gpu: 1
          # ... container spec

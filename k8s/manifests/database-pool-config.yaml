##
# PgBouncer Configuration
#
# For production deployments, PgBouncer should be used as a connection
# pooler in front of PostgreSQL to handle connection multiplexing.
##

apiVersion: v1
kind: ConfigMap
metadata:
  name: pgbouncer-config
  namespace: blockd
  labels:
    app.kubernetes.io/name: pgbouncer
    app.kubernetes.io/component: connection-pooler
data:
  pgbouncer.ini: |
    [databases]
    blockd = host=postgresql-primary port=5432 dbname=blockd

    [pgbouncer]
    listen_addr = 0.0.0.0
    listen_port = 6432
    auth_type = scram-sha-256
    auth_file = /etc/pgbouncer/userlist.txt

    # Pool mode: session, transaction, or statement
    # transaction mode is recommended for most workloads
    pool_mode = transaction

    # Maximum number of client connections
    max_client_conn = 1000

    # Default pool size per database/user pair
    default_pool_size = 50

    # Minimum pool size
    min_pool_size = 10

    # Reserve pool for burst handling
    reserve_pool_size = 10
    reserve_pool_timeout = 5

    # Connection timeouts
    server_connect_timeout = 10
    server_idle_timeout = 600
    server_lifetime = 3600

    # Client timeouts
    client_idle_timeout = 600
    client_login_timeout = 60

    # Query timeout (0 = disabled, handled at Prisma level)
    query_timeout = 0

    # Logging
    log_connections = 1
    log_disconnections = 1
    log_pooler_errors = 1

    # Stats
    stats_period = 60

    # Admin console
    admin_users = pgbouncer_admin
    stats_users = pgbouncer_stats

  userlist.txt: |
    ; Format: "username" "password"
    ; Password should be scram-sha-256 hashed
    ; Generate with: echo -n "password" | openssl dgst -sha256 -binary | base64
    ; This is a placeholder - use Kubernetes secrets in production
    "blockd_app" "SCRAM-SHA-256$4096:..."
    "pgbouncer_admin" "SCRAM-SHA-256$4096:..."
    "pgbouncer_stats" "SCRAM-SHA-256$4096:..."

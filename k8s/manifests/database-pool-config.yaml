##
# Database Connection Pool Configuration
#
# This ConfigMap provides default connection pool settings for all
# Blockd backend services. Services can override these defaults
# by specifying their own environment variables.
#
# Pool sizing guidelines:
# - Total connections across all service instances should not exceed
#   PostgreSQL max_connections (typically 200-500)
# - Each service instance gets its own pool
# - Formula: (instances * connection_limit * services) < max_connections
#
# Example for 3 instances each of 4 services with 50 connections:
# 3 * 50 * 4 = 600 connections (would exceed typical max_connections)
# Reduce to 25 each: 3 * 25 * 4 = 300 connections (safe)
##

apiVersion: v1
kind: ConfigMap
metadata:
  name: database-pool-config
  namespace: blockd
  labels:
    app.kubernetes.io/name: blockd
    app.kubernetes.io/component: database-config
data:
  # Default connection limits per service type
  # Services can override with their own env vars

  # High-activity services (session-service, ai-detection)
  DATABASE_CONNECTION_LIMIT_HIGH: "60"

  # Medium-activity services (auth-service, video-service)
  DATABASE_CONNECTION_LIMIT_MEDIUM: "40"

  # Low-activity services (api-gateway, websocket-service)
  DATABASE_CONNECTION_LIMIT_LOW: "25"

  # Shared pool settings
  DATABASE_POOL_TIMEOUT: "30"
  DATABASE_CONNECT_TIMEOUT: "10"
  DATABASE_STATEMENT_TIMEOUT: "60000"
  DATABASE_IDLE_TIMEOUT: "60"

---

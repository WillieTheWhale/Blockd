# Celery Workers HorizontalPodAutoscalers
# Scales workers based on CPU, memory, and RabbitMQ queue depth
---
# Video Worker HPA - scales based on CPU (FFmpeg is CPU intensive)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: celery-worker-video-hpa
  namespace: blockd
  labels:
    app: celery-worker
    component: video
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: celery-worker-video
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 4
          periodSeconds: 15
      selectPolicy: Max

---
# AI Worker HPA - scales based on CPU and queue depth
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: celery-worker-ai-hpa
  namespace: blockd
  labels:
    app: celery-worker
    component: ai
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: celery-worker-ai
  minReplicas: 3
  maxReplicas: 15
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 20
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 5
          periodSeconds: 15
      selectPolicy: Max

---
# Security Worker HPA - scales conservatively (critical path)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: celery-worker-security-hpa
  namespace: blockd
  labels:
    app: celery-worker
    component: security
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: celery-worker-security
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 600  # Longer stabilization for security
      policies:
        - type: Percent
          value: 10
          periodSeconds: 120
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 50
          periodSeconds: 15
        - type: Pods
          value: 2
          periodSeconds: 15
      selectPolicy: Max

---
# Gaze Worker HPA - scales based on processing load
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: celery-worker-gaze-hpa
  namespace: blockd
  labels:
    app: celery-worker
    component: gaze
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: celery-worker-gaze
  minReplicas: 2
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 4
          periodSeconds: 15
      selectPolicy: Max

---
# PodDisruptionBudgets to ensure availability during updates
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: celery-worker-video-pdb
  namespace: blockd
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: celery-worker
      component: video

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: celery-worker-ai-pdb
  namespace: blockd
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: celery-worker
      component: ai

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: celery-worker-security-pdb
  namespace: blockd
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: celery-worker
      component: security

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: celery-worker-gaze-pdb
  namespace: blockd
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: celery-worker
      component: gaze

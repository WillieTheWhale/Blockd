# etcd Cluster for Patroni Leader Election
# Provides distributed consensus for PostgreSQL primary election and failover
#
# Architecture:
# - 3-node etcd cluster for quorum
# - TLS encryption for inter-node communication
# - Persistent storage for data durability
#
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: etcd-config
  namespace: blockd
  labels:
    app: etcd
data:
  # etcd configuration
  etcd.conf.yml: |
    name: '${ETCD_NAME}'
    data-dir: /var/lib/etcd/data
    wal-dir: /var/lib/etcd/wal

    listen-peer-urls: http://0.0.0.0:2380
    listen-client-urls: http://0.0.0.0:2379

    initial-advertise-peer-urls: http://${ETCD_NAME}.etcd:2380
    advertise-client-urls: http://${ETCD_NAME}.etcd:2379

    initial-cluster: etcd-0=http://etcd-0.etcd:2380,etcd-1=http://etcd-1.etcd:2380,etcd-2=http://etcd-2.etcd:2380
    initial-cluster-token: blockd-etcd-cluster
    initial-cluster-state: new

    # Performance tuning
    heartbeat-interval: 100
    election-timeout: 1000

    # Snapshots
    snapshot-count: 10000
    max-snapshots: 5
    max-wals: 5

    # Quotas
    quota-backend-bytes: 8589934592  # 8GB

    # Logging
    log-level: info
    log-outputs: [stderr]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: etcd
  namespace: blockd
  labels:
    app: etcd
    component: consensus
spec:
  serviceName: etcd
  replicas: 3
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: etcd
  template:
    metadata:
      labels:
        app: etcd
        component: consensus
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "2379"
    spec:
      securityContext:
        fsGroup: 1001
        runAsUser: 1001
        runAsGroup: 1001

      containers:
        - name: etcd
          image: bitnami/etcd:3.5.12
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 2379
              name: client
              protocol: TCP
            - containerPort: 2380
              name: peer
              protocol: TCP
          env:
            - name: ETCD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: ETCD_DATA_DIR
              value: /var/lib/etcd/data
            - name: ETCD_WAL_DIR
              value: /var/lib/etcd/wal
            - name: ETCD_LISTEN_PEER_URLS
              value: http://0.0.0.0:2380
            - name: ETCD_LISTEN_CLIENT_URLS
              value: http://0.0.0.0:2379
            - name: ETCD_ADVERTISE_CLIENT_URLS
              value: http://$(ETCD_NAME).etcd:2379
            - name: ETCD_INITIAL_ADVERTISE_PEER_URLS
              value: http://$(ETCD_NAME).etcd:2380
            - name: ETCD_INITIAL_CLUSTER
              value: etcd-0=http://etcd-0.etcd:2380,etcd-1=http://etcd-1.etcd:2380,etcd-2=http://etcd-2.etcd:2380
            - name: ETCD_INITIAL_CLUSTER_TOKEN
              value: blockd-etcd-cluster
            - name: ETCD_INITIAL_CLUSTER_STATE
              value: new
            - name: ETCD_AUTO_COMPACTION_MODE
              value: revision
            - name: ETCD_AUTO_COMPACTION_RETENTION
              value: "1000"
            - name: ETCD_QUOTA_BACKEND_BYTES
              value: "8589934592"
            - name: ALLOW_NONE_AUTHENTICATION
              value: "yes"
          volumeMounts:
            - name: etcd-data
              mountPath: /var/lib/etcd
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health?serializable=true
              port: client
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health?serializable=true
              port: client
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    # Graceful shutdown: remove member from cluster if shutting down
                    MEMBER_ID=$(etcdctl member list | grep $(hostname) | cut -d',' -f1)
                    if [ -n "$MEMBER_ID" ]; then
                      etcdctl member remove $MEMBER_ID || true
                    fi

      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: etcd
              topologyKey: kubernetes.io/hostname

  volumeClaimTemplates:
    - metadata:
        name: etcd-data
        labels:
          app: etcd
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: fast-ssd
        resources:
          requests:
            storage: 10Gi
---
# Headless service for etcd peer discovery
apiVersion: v1
kind: Service
metadata:
  name: etcd
  namespace: blockd
  labels:
    app: etcd
spec:
  type: ClusterIP
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: etcd
  ports:
    - name: client
      port: 2379
      targetPort: client
    - name: peer
      port: 2380
      targetPort: peer
---
# Client service for etcd connections
apiVersion: v1
kind: Service
metadata:
  name: etcd-client
  namespace: blockd
  labels:
    app: etcd
spec:
  type: ClusterIP
  selector:
    app: etcd
  ports:
    - name: client
      port: 2379
      targetPort: client

# ServiceMonitors for Prometheus Operator
# Enables automatic metrics scraping from all Blockd services
#
# Prerequisites:
# 1. Prometheus Operator installed in the monitoring namespace
# 2. Services must expose /metrics endpoint (see metrics middleware)
# 3. Prometheus must have rbac access to the blockd namespace
---
# API Gateway ServiceMonitor
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: api-gateway
  namespace: monitoring
  labels:
    app: api-gateway
    release: prometheus
spec:
  namespaceSelector:
    matchNames:
      - blockd
  selector:
    matchLabels:
      app: api-gateway
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
      honorLabels: true
  jobLabel: api-gateway


# Default values for blockd - Development/Local environment
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

global:
  imageRegistry: ""
  imagePullSecrets: []
  storageClass: ""

# Namespace configuration
namespace: blockd

# Network Policies - Enable in production for service isolation
# Implements principle of least privilege for inter-service communication
networkPolicies:
  enabled: false  # Enable in production: set to true in values-production.yaml

# Image configuration
images:
  apiGateway:
    repository: blockd/api-gateway
    tag: latest
    pullPolicy: IfNotPresent
  authService:
    repository: blockd/auth-service
    tag: latest
    pullPolicy: IfNotPresent
  sessionService:
    repository: blockd/session-service
    tag: latest
    pullPolicy: IfNotPresent
  aiDetection:
    repository: blockd/ai-detection
    tag: latest
    pullPolicy: IfNotPresent
  eyeTracking:
    repository: blockd/eye-tracking
    tag: latest
    pullPolicy: IfNotPresent
  responseTiming:
    repository: blockd/response-timing
    tag: latest
    pullPolicy: IfNotPresent
  videoService:
    repository: blockd/video-service
    tag: latest
    pullPolicy: IfNotPresent
  websocketService:
    repository: blockd/websocket-service
    tag: latest
    pullPolicy: IfNotPresent
  frontend:
    repository: blockd/frontend
    tag: latest
    pullPolicy: IfNotPresent

# PostgreSQL configuration
postgresql:
  enabled: true
  image: postgres:18.1-alpine
  replicas: 1
  resources:
    requests:
      memory: "1Gi"
      cpu: "500m"
    limits:
      memory: "2Gi"
      cpu: "1000m"
  persistence:
    enabled: true
    size: 20Gi

# Redis configuration
redis:
  enabled: true
  image: redis:8.4-alpine
  replicas: 3
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  persistence:
    enabled: true
    size: 5Gi

# RabbitMQ configuration
rabbitmq:
  enabled: true
  image: rabbitmq:4-management-alpine
  replicas: 3
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "500m"
  persistence:
    enabled: true
    size: 10Gi

# API Gateway configuration
apiGateway:
  enabled: true
  replicas: 3
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

# Auth Service configuration
authService:
  enabled: true
  replicas: 2
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  autoscaling:
    enabled: false

# Session Service configuration
sessionService:
  enabled: true
  replicas: 2
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  autoscaling:
    enabled: false

# AI Detection Service configuration
aiDetection:
  enabled: true
  replicas: 3
  resources:
    requests:
      memory: "1Gi"
      cpu: "500m"
    limits:
      memory: "2Gi"
      cpu: "1000m"
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

# Eye Tracking Service configuration
eyeTracking:
  enabled: true
  replicas: 2
  resources:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "1Gi"
      cpu: "1000m"
  autoscaling:
    enabled: false

# Response Timing Service configuration
responseTiming:
  enabled: true
  replicas: 2
  resources:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "1Gi"
      cpu: "1000m"
  autoscaling:
    enabled: false

# WebSocket Service configuration
websocketService:
  enabled: true
  replicas: 2
  resources:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "1Gi"
      cpu: "1000m"
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

# Video Service configuration
videoService:
  enabled: true
  replicas: 2
  resources:
    requests:
      memory: "1Gi"
      cpu: "500m"
    limits:
      memory: "2Gi"
      cpu: "1000m"
  autoscaling:
    enabled: false

# Frontend configuration
frontend:
  enabled: true
  replicas: 3
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "250m"
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

# Ingress configuration
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
  hosts:
    - host: blockd.local
      paths:
        - path: /
          pathType: Prefix
          service: frontend
          port: 80
    - host: api.blockd.local
      paths:
        - path: /
          pathType: Prefix
          service: api-gateway
          port: 3000
  tls:
    - secretName: blockd-tls-cert
      hosts:
        - blockd.local
        - api.blockd.local

# ConfigMap data
configMap:
  postgresDb: blockd
  s3Bucket: blockd-videos-dev
  logLevel: debug

# Secrets configuration
# IMPORTANT: Set create: true only in environment-specific values files
# and provide secrets via external secret management (e.g., sealed-secrets, external-secrets, vault)
secrets:
  create: false
  # Secret values should be provided via:
  # 1. External secret management (recommended)
  # 2. --set flags during helm install/upgrade
  # 3. Environment-specific values files (not committed to version control)
  #
  # Required secrets (provide via secure method):
  # - postgresUser
  # - postgresPassword
  # - redisPassword
  # - rabbitmqUser
  # - rabbitmqPassword
  # - rabbitmqErlangCookie
  # - jwtSecret
  # - openaiApiKey
  # - anthropicApiKey
  # - awsAccessKeyId
  # - awsSecretAccessKey

{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: blockd-secrets
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "blockd.labels" . | nindent 4 }}
type: Opaque
data:
  postgres_user: {{ .Values.secrets.postgresUser | b64enc | quote }}
  postgres_password: {{ .Values.secrets.postgresPassword | b64enc | quote }}
  redis_password: {{ .Values.secrets.redisPassword | b64enc | quote }}
  rabbitmq_user: {{ .Values.secrets.rabbitmqUser | b64enc | quote }}
  rabbitmq_password: {{ .Values.secrets.rabbitmqPassword | b64enc | quote }}
  rabbitmq_erlang_cookie: {{ .Values.secrets.rabbitmqErlangCookie | b64enc | quote }}
  jwt_secret: {{ .Values.secrets.jwtSecret | b64enc | quote }}
  database_url: {{ include "blockd.databaseUrl" . | b64enc | quote }}
  redis_url: {{ include "blockd.redisUrl" . | b64enc | quote }}
  rabbitmq_url: {{ include "blockd.rabbitmqUrl" . | b64enc | quote }}
  openai_api_key: {{ .Values.secrets.openaiApiKey | b64enc | quote }}
  anthropic_api_key: {{ .Values.secrets.anthropicApiKey | b64enc | quote }}
  aws_access_key_id: {{ .Values.secrets.awsAccessKeyId | b64enc | quote }}
  aws_secret_access_key: {{ .Values.secrets.awsSecretAccessKey | b64enc | quote }}
{{- end }}

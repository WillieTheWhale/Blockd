{{- if .Values.apiGateway.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: {{ .Values.namespace }}
  labels:
    app: api-gateway
    {{- include "blockd.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: api-gateway
    {{- if .Values.deployment.version }}
    version: {{ .Values.deployment.version }}
    {{- end }}
  ports:
  - name: http
    port: 3000
    targetPort: http
    protocol: TCP
{{- end }}

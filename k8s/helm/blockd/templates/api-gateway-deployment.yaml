{{- if .Values.apiGateway.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway{{ if .Values.deployment.version }}-{{ .Values.deployment.version }}{{ end }}
  namespace: {{ .Values.namespace }}
  labels:
    app: api-gateway
    version: {{ .Values.deployment.version | default "blue" }}
    {{- include "blockd.labels" . | nindent 4 }}
spec:
  {{- if not .Values.apiGateway.autoscaling.enabled }}
  replicas: {{ .Values.apiGateway.replicas }}
  {{- end }}
  selector:
    matchLabels:
      app: api-gateway
      version: {{ .Values.deployment.version | default "blue" }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: api-gateway
        version: {{ .Values.deployment.version | default "blue" }}
        {{- include "blockd.selectorLabels" . | nindent 8 }}
    spec:
      {{- if .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.global.imagePullSecrets | nindent 8 }}
      {{- end }}
      containers:
      - name: api-gateway
        image: "{{ .Values.global.imageRegistry | default .Values.images.apiGateway.repository }}:{{ .Values.images.apiGateway.tag | default .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.images.apiGateway.pullPolicy }}
        ports:
        - name: http
          containerPort: 3000
          protocol: TCP
        env:
        - name: NODE_ENV
          value: {{ .Values.environment | default "production" }}
        - name: PORT
          value: "3000"
        - name: AUTH_SERVICE_URL
          value: "http://auth-service:3001"
        - name: SESSION_SERVICE_URL
          value: "http://session-service:3002"
        - name: AI_DETECTION_URL
          value: "http://ai-detection:5000"
        - name: EYE_TRACKING_URL
          value: "http://eye-tracking:5001"
        - name: RESPONSE_TIMING_URL
          value: "http://response-timing:5002"
        - name: VIDEO_SERVICE_URL
          value: "http://video-service:3003"
        - name: WEBSOCKET_SERVICE_URL
          value: "http://websocket-service:3004"
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          {{- toYaml .Values.apiGateway.resources | nindent 10 }}
{{- end }}
